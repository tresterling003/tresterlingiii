<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<title>RIVAL — Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         background: #0E0F12; color: #F4F5F7; font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 28px; font-style: italic; font-weight: 800; text-transform: uppercase; margin: 24px 0 8px; letter-spacing: .02em; }
  p { color: #A2A7B1; margin: 0 0 24px; max-width: 320px; }
  button { background: #C8FF3D; color: #0B0D05; border: 0; border-radius: 10px; height: 48px; padding: 0 24px; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <main>
    <img src="/apple-touch-icon.png" alt="">
    <h1>You're offline</h1>
    <p>RIVAL needs a connection to keep scores live. Reconnect and you're right back in the game.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
