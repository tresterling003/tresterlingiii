<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>END ZONE! QB Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Broadcast-TV look: sharp skewed panels, condensed type, team-color stripes. No bubbles. */
:root{--ink:#f4f6fb;--panel:#0b1120;--panel2:#141c31;--line:rgba(255,255,255,.12);--gold:#ffc72c;--red:#e5383b;--blue:#2f6bff;--team:#d7263d;--opp:#1b4fd8;
  --disp:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;--cond:"Oswald","Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow Condensed","Oswald",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05080f;color:var(--ink);touch-action:none;overscroll-behavior:none;font-family:var(--body);font-weight:700}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
#fx{pointer-events:none;z-index:2}#gl{z-index:1;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.skew{transform:skewX(-12deg)}.unskew{display:inline-block;transform:skewX(12deg)}

/* ---- HUD / scorebug ---- */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px);display:flex;gap:8px;align-items:flex-start}
#bug{display:flex;align-items:stretch;height:34px;transform:skewX(-12deg);box-shadow:0 6px 18px rgba(0,0,0,.45);overflow:hidden;border-radius:2px}
#bug>div{display:flex;align-items:center;justify-content:center;padding:0 10px;white-space:nowrap}
#bug .tm{min-width:52px;font-family:var(--disp);font-size:22px;letter-spacing:1px;color:#fff;position:relative}
#bug .tm span{transform:skewX(12deg)}
#bug .sc{background:#fff;color:#0b1120;font-family:var(--disp);font-size:24px;min-width:34px}
#bug .sc span,#bug .clk span,#bug .dd span{transform:skewX(12deg)}
#bug .clk{background:var(--panel);font-family:var(--cond);font-size:15px;letter-spacing:.5px;min-width:78px}
#bug .dd{background:var(--gold);color:#0b1120;font-family:var(--cond);font-weight:700;font-size:15px;min-width:86px;text-transform:uppercase}
#bug .spot{background:var(--panel2);font-family:var(--cond);font-size:13px;color:#c9d2e8;min-width:70px}
#bug .pos::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:var(--gold)}
@media (max-width:520px){#hStars{display:none!important}#bug{height:30px}#bug .sc{min-width:26px;font-size:20px}#bug .tm{min-width:40px!important;font-size:17px!important;padding:0 6px}#bug .clk{min-width:0!important;padding:0 7px}#bug .dd{min-width:0!important;padding:0 7px}#bug .spot{display:none}#bug .tm{min-width:44px;font-size:19px}#bug .clk{min-width:64px;font-size:13px}#bug .dd{min-width:72px;font-size:13px}}
#hStars{height:34px;display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--panel);transform:skewX(-12deg)}
#hStars span{transform:skewX(12deg)}
.hstar{font-size:16px;color:rgba(255,255,255,.22)}.hstar.on{color:var(--gold);text-shadow:0 0 8px rgba(255,199,44,.7)}
.hbtn{pointer-events:auto;width:40px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel);transform:skewX(-12deg)}
.hbtn svg{transform:skewX(12deg);width:20px;height:20px;fill:#fff}
#pressure{position:fixed;left:50%;transform:translateX(-50%) skewX(-12deg);top:calc(env(safe-area-inset-top) + 50px);width:min(46vw,240px);height:8px;z-index:5;overflow:hidden;pointer-events:none;background:rgba(11,17,32,.85)}
#pressure i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39d98a,var(--gold) 60%,var(--red))}
#pressure span{display:none}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#plays{display:flex;gap:8px;overflow-x:auto;max-width:100%;pointer-events:auto;padding:2px 4px;touch-action:pan-x}
.play{flex:none;width:118px;background:linear-gradient(180deg,#18223b,#0b1120);border:2px solid var(--line);text-align:left;padding:6px 7px 7px;position:relative;transform:skewX(-6deg)}
.play>*{transform:skewX(6deg)}
.play .pn{display:block;font-family:var(--cond);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play svg{display:block;width:100%;height:58px;margin-top:3px;background:#1d5a2c;border:1px solid rgba(255,255,255,.15)}
.play.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 8px 18px rgba(0,0,0,.5)}
.play.on .pn{color:var(--gold)}
#snap{pointer-events:auto;font-family:var(--disp);font-size:30px;letter-spacing:3px;padding:6px 52px 4px;color:#0b1120;background:var(--gold);transform:skewX(-12deg);box-shadow:0 8px 20px rgba(0,0,0,.45);position:relative}
#snap>span{display:inline-block;transform:skewX(12deg)}
#snap::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#0b1120}
#snap:active{transform:skewX(-12deg) scale(.96)}
#hint{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.3px;text-transform:uppercase;text-shadow:0 2px 6px #000;text-align:center;opacity:.9}

/* big call-outs: slammed letters on a colored band */
#big{position:fixed;left:0;right:0;top:30%;z-index:6;text-align:center;pointer-events:none}
#big .w{display:inline-block;position:relative;font-family:var(--disp);line-height:.95;white-space:nowrap;padding:4px 26px 0;letter-spacing:2px}
#big .w::before{content:"";position:absolute;inset:8% -10px 4%;background:var(--team);transform:skewX(-14deg) scaleX(0);transform-origin:left;animation:band .35s cubic-bezier(.2,1,.3,1) forwards;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#big.bad .w::before{background:var(--red)}#big.cool .w::before{background:var(--blue)}
#big .l{display:inline-block;position:relative;color:#fff;text-shadow:3px 4px 0 rgba(0,0,0,.45);transform:translateX(-40px) skewX(-12deg);opacity:0;animation:slam .35s cubic-bezier(.2,1.4,.4,1) forwards}
#big .sub{display:inline-block;margin-top:10px;font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:1px;text-transform:uppercase;background:rgba(11,17,32,.88);padding:4px 14px;transform:skewX(-12deg);opacity:0;animation:fadein .3s .35s forwards}
@keyframes band{to{transform:skewX(-14deg) scaleX(1)}}
@keyframes slam{to{opacity:1;transform:translateX(0) skewX(-12deg)}}
@keyframes fadein{to{opacity:1}}
/* down & distance sweep between plays */
#sweep{position:fixed;left:0;right:0;top:42%;z-index:6;pointer-events:none;display:flex;justify-content:center}
#sweep div{font-family:var(--disp);font-size:min(13vw,64px);letter-spacing:3px;padding:2px 40px 0;background:rgba(11,17,32,.92);border-left:8px solid var(--gold);transform:skewX(-12deg);animation:sweep 1.5s cubic-bezier(.2,1,.3,1) forwards}
#sweep div b{color:var(--gold);font-weight:400}
@keyframes sweep{0%{transform:translateX(-120vw) skewX(-12deg)}22%{transform:translateX(0) skewX(-12deg)}78%{transform:translateX(0) skewX(-12deg);opacity:1}100%{transform:translateX(120vw) skewX(-12deg);opacity:0}}
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);z-index:4;pointer-events:none;width:min(92vw,460px);text-align:left;padding:8px 14px 10px;background:rgba(11,17,32,.9);border-left:6px solid var(--gold);transition:opacity .5s}
#banner .bt{font-family:var(--disp);font-size:28px;letter-spacing:1.5px;line-height:1}
#banner .bs{font-size:15px;font-weight:600;margin-top:3px;line-height:1.25;color:#d7deef}
#banner .bo{font-size:12px;margin-top:6px;color:var(--gold);font-family:var(--cond);letter-spacing:.5px;text-transform:uppercase}
#throwTxt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);z-index:5;pointer-events:none;font-family:var(--disp);font-size:26px;letter-spacing:2px;color:#fff;text-shadow:0 2px 8px #000;opacity:0}
#throwTxt.show{animation:tt 1.3s ease-out}@keyframes tt{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
#rot{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);z-index:5;pointer-events:none;background:rgba(11,17,32,.85);border-left:4px solid var(--gold);padding:5px 12px;font-family:var(--cond);font-size:13px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
#xhair{display:none!important}

/* ---- menus ---- */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
  background:linear-gradient(90deg,rgba(5,8,15,.92),rgba(5,8,15,.55) 60%,rgba(5,8,15,.3));overflow-y:auto;touch-action:pan-y}
.menuTop{width:100%;display:flex;justify-content:space-between;align-items:center}
.coinPill{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--panel);transform:skewX(-12deg);font-family:var(--cond);font-size:16px}
.coinPill>*{transform:skewX(12deg)}
.coin{display:inline-block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f2b705 55%,#a87400);flex:none}
.iconBtn{width:42px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel);transform:skewX(-12deg)}.iconBtn svg{transform:skewX(12deg);width:20px;height:20px;fill:#fff}
#menu{align-items:flex-start}
.logo{margin-top:6vh;text-align:left}
.logo .l1{font-family:var(--disp);font-size:min(22vw,120px);line-height:.82;letter-spacing:2px;color:#fff;transform:skewX(-10deg);text-shadow:6px 6px 0 var(--team)}
.logo .l2{display:inline-block;margin-top:10px;font-family:var(--cond);font-weight:700;font-size:min(4.6vw,20px);letter-spacing:5px;background:var(--gold);color:#0b1120;padding:4px 14px;transform:skewX(-12deg)}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:min(88vw,380px);margin-top:auto;margin-bottom:3vh}
.btn{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 18px 9px 22px;text-align:left;font-family:var(--disp);font-size:30px;letter-spacing:2px;line-height:1;
  background:linear-gradient(90deg,#1a2440,#0f1628);color:#fff;transform:skewX(-10deg);position:relative;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .12s}
.btn>*{transform:skewX(10deg)}
.btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--gold)}
.btn small{display:block;font-family:var(--cond);font-weight:500;font-size:13px;letter-spacing:.6px;color:#aab6d3;margin-top:3px;text-transform:uppercase}
.btn:active{transform:skewX(-10deg) translateX(6px)}
.btn.primary,.btn:not(.blue):not(.red):not(.dark):first-child{background:linear-gradient(90deg,var(--gold),#ffb000);color:#0b1120}.btn.primary small,.btn:not(.blue):not(.red):not(.dark):first-child small{color:#3b2c00}
.btn.primary::before{background:#0b1120}
.btn.blue::before{background:var(--blue)}.btn.red::before{background:var(--red)}.btn.dark::before{background:#56607a}
@keyframes rise{from{opacity:0;transform:translateX(-40px) skewX(-10deg)}}
.screen:not(.hidden) .menuBtns .btn,.screen:not(.hidden) .lv,.screen:not(.hidden) .team{animation:rise .4s cubic-bezier(.2,1,.3,1) both}
.menuBtns .btn:nth-child(2){animation-delay:.06s!important}.menuBtns .btn:nth-child(3){animation-delay:.12s!important}
.topbar{width:100%;max-width:640px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar h2{flex:1;margin:0;font-family:var(--disp);font-weight:400;font-size:34px;letter-spacing:2px;transform:skewX(-10deg)}
.back{width:42px;height:38px;font-size:24px;background:var(--panel);transform:skewX(-12deg)}
#lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%;max-width:640px}
.lv{background:linear-gradient(90deg,#18223b,#0b1120);border-left:5px solid var(--gold);padding:8px 10px;text-align:left;min-height:74px;transform:skewX(-6deg)}
.lv>*{transform:skewX(6deg)}
.lv .ln{font-family:var(--disp);font-size:16px;letter-spacing:1.5px;color:var(--gold)}
.lv .lt{font-family:var(--cond);font-size:16px;font-weight:700;text-transform:uppercase;line-height:1.1;margin:2px 0 4px}
.lv .ls{font-size:14px;color:rgba(255,255,255,.2)}.lv .ls .on{color:var(--gold)}
.lv.locked{opacity:.35;border-left-color:#56607a}
.card{margin:auto;width:min(92vw,400px);text-align:left;background:linear-gradient(180deg,rgba(20,28,49,.96),rgba(8,12,24,.97));border-left:8px solid var(--gold);padding:18px 18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.55);animation:cardIn .4s cubic-bezier(.2,1,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateX(-30px)}}
#rTitle{font-family:var(--disp);font-size:46px;letter-spacing:2px;line-height:.9}
#rSub{font-family:var(--cond);font-size:15px;color:#aab6d3;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
#rStars{font-size:40px;margin:10px 0 2px;letter-spacing:4px;color:rgba(255,255,255,.15)}
#rStars span{display:inline-block;transform:scale(0);animation:spop .4s forwards}#rStars span.on{color:var(--gold)}
@keyframes spop{60%{transform:scale(1.3)}100%{transform:scale(1)}}
#rList{font-family:var(--cond);font-size:15px;margin-top:6px;line-height:1.75;text-transform:uppercase;letter-spacing:.3px}
#rList div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}#rList .ok{color:#7dffb0}#rList .no{opacity:.45}
#rCoins{margin:10px 0 2px;display:inline-flex;gap:8px;align-items:center;font-family:var(--disp);font-size:28px;letter-spacing:1px}
.rBtns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.rBtns .btn{font-size:26px}
#teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%;max-width:640px}
.team{position:relative;padding:12px;text-align:left;min-height:76px;overflow:hidden;transform:skewX(-6deg);border:2px solid transparent}
.team>*{transform:skewX(6deg)}
.team.sel{border-color:var(--gold)}
.team .tn{font-family:var(--disp);font-size:26px;letter-spacing:1.5px}
.team .sw{display:flex;gap:4px;margin-top:4px}.team .sw i{width:16px;height:16px;border:2px solid rgba(255,255,255,.5)}
.team .pr{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);padding:3px 8px;font-family:var(--cond);font-size:13px;display:flex;gap:4px;align-items:center}
#numRow{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 14px}
#numRow button{width:52px;height:46px;background:var(--panel2);font-size:28px;transform:skewX(-10deg)}
#numRow span{font-family:var(--disp);font-size:64px;min-width:100px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);z-index:30;background:var(--panel);border-left:5px solid var(--gold);padding:8px 16px;font-family:var(--cond);text-transform:uppercase;pointer-events:none;transition:opacity .3s;opacity:0}
@media (orientation:landscape) and (max-height:560px){
  #menu{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  #menu .menuTop{width:100%;flex:0 0 100%}
  #menu .logo{margin:0 0 0 2vw}#menu .logo .l1{font-size:min(17vh,110px)}
  #menu .menuBtns{margin:0 2vw 0 0;width:min(46vw,380px)}
  .btn{font-size:26px;padding:8px 16px 7px 20px}
  #banner{top:calc(env(safe-area-inset-top) + 48px);padding:6px 12px 8px}#banner .bt{font-size:22px}#banner .bs{font-size:13px}
}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:34px;letter-spacing:3px;color:var(--gold);background:#05080f}
</style>

<body>
<canvas id="gl"></canvas><canvas id="fx"></canvas>
<div id="throwTxt"></div>
<div id="rot" class="hidden">↻ Turn sideways to see the whole field</div>
<div id="xhair" class="hidden"><i></i><b></b><span id="xYd"></span></div>
<div id="loading">LOADING STADIUM</div>

<div id="hud" class="hidden">
  <div id="bug"><div class="tm pos" id="bugUs"><span>BLZ</span></div><div class="sc"><span id="scUs">0</span></div><div class="tm" id="bugThem"><span>VNM</span></div><div class="sc"><span id="scThem">0</span></div>
    <div class="clk"><span id="clk">4TH 2:00</span></div><div class="dd"><span id="ddDown">1ST &amp; 10</span></div><div class="spot"><span id="ddSpot">OPP 25</span></div></div>
  <div style="flex:1"></div>
  <div id="hStars"></div>
  <button class="hbtn" id="bMute" aria-label="Mute"></button>
  <button class="hbtn" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg></button>
</div>
<div id="pressure" class="hidden"><span></span><i></i></div>
<div id="banner" class="hidden"><div class="bt"></div><div class="bs"></div><div class="bo"></div></div>
<div id="big" class="hidden"></div>
<div id="sweep"></div>
<div id="bottom" class="hidden">
  <div id="hint"></div>
  <div id="plays"></div>
  <button id="snap"><span>SNAP</span></button>
</div>

<div id="menu" class="screen hidden">
  <div class="menuTop"><div class="coinPill"><span class="coin"></span><span class="cCoins">0</span></div><button class="iconBtn" id="bSound" aria-label="Sound"></button></div>
  <div class="logo"><div class="l1">END<br>ZONE</div><div class="l2">QB SHOWDOWN</div></div>
  <div class="menuBtns">
    <button class="btn primary" id="bCareer"><span>Career</span><small id="careerSub">12 drives</small></button>
    <button class="btn blue" id="bFG"><span>Field Goal Frenzy</span><small id="fgSub">How far can you kick it?</small></button>
    <button class="btn red" id="bLocker"><span>Locker Room</span><small>Team &amp; number</small></button>
  </div>
</div>
<div id="levels" class="screen hidden">
  <div class="topbar"><button class="back" data-go="menu">‹</button><h2>CAREER</h2><div class="coinPill"><span class="coin"></span><span class="cCoins">0</span></div></div>
  <div id="lvGrid"></div>
</div>
<div id="locker" class="screen hidden">
  <div class="topbar"><button class="back" data-go="menu">‹</button><h2>LOCKER ROOM</h2><div class="coinPill"><span class="coin"></span><span class="cCoins">0</span></div></div>
  <div id="numRow"><button id="nMinus">−</button><span id="nVal">7</span><button id="nPlus">+</button></div>
  <div id="teams"></div>
</div>
<div id="result" class="screen hidden"><div class="card"><div id="rTitle"></div><div id="rSub"></div><div id="rStars"></div><div id="rList"></div><div id="rCoins"></div><div class="rBtns" id="rBtns"></div></div></div>
<div id="pause" class="screen hidden"><div class="card"><div id="rTitle2" style="font-family:var(--disp);font-size:46px;letter-spacing:2px">PAUSED</div><div class="rBtns">
  <button class="btn primary" id="pResume"><span>Resume</span></button><button class="btn dark" id="pSound"><span>Sound: On</span></button><button class="btn blue" id="pRetry"><span>Restart</span></button><button class="btn dark" id="pQuit"><span>Quit</span></button></div></div></div>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   END ZONE! — an original 3D quarterback game (Three.js).
   Units are yards. x = across the field, y = up, z = downfield.
   Our offence attacks +z; their goal line is z = 100, end zone to z = 110.
   ===================================================================== */
import * as THREE from 'three';
const $=s=>document.querySelector(s);

let fieldMat;
function fieldTexture(team,opp){
  const PX=14,Wc=60*PX,Hc=140*PX; // x -30..30, z -15..125
  return canvasTex(Wc,Hc,(c)=>{
    const X=x=>(30-x)*PX,Z=z=>(z+15)*PX;
    c.fillStyle='#24702b';c.fillRect(0,0,Wc,Hc);
    for(let z=-10;z<110;z+=5){c.fillStyle=((z/5)&1)?'#2b7f31':'#327f36';c.fillRect(0,Z(z),Wc,5*PX);}
    // grass speckle
    for(let i=0;i<26000;i++){c.fillStyle=Math.random()<0.5?'rgba(0,0,0,.06)':'rgba(255,255,255,.04)';c.fillRect(Math.random()*Wc,Math.random()*Hc,2,3);}
    // end zones
    const ez=(z0,col,txt)=>{c.fillStyle=col;c.globalAlpha=0.85;c.fillRect(X(HALF),Z(z0),X(-HALF)-X(HALF),10*PX);c.globalAlpha=1;
      c.save();c.translate(Wc/2,Z(z0+5));c.scale(1,-1);c.fillStyle='rgba(255,255,255,.92)';c.font=`${7*PX}px "Oswald","Arial Narrow",Arial`;c.textAlign='center';c.textBaseline='middle';
      c.lineWidth=PX*0.5;c.strokeStyle='rgba(0,0,0,.35)';c.strokeText(txt,0,0,(2*HALF-6)*PX);c.fillText(txt,0,0,(2*HALF-6)*PX);c.restore();};
    ez(-10,team.jersey,team.name.toUpperCase());ez(100,opp.jersey,opp.name.toUpperCase());
    c.fillStyle='#fff';
    // boundary
    const xl=X(HALF),xw=X(-HALF)-X(HALF);
    c.fillRect(xl-PX*0.6,Z(-10),PX*0.6,120*PX);c.fillRect(xl+xw,Z(-10),PX*0.6,120*PX);
    c.fillRect(xl,Z(-10),xw,PX*0.6);c.fillRect(xl,Z(110)-PX*0.6,xw,PX*0.6);
    for(let z=0;z<=100;z+=5){c.fillRect(xl,Z(z)-PX*0.2,xw,PX*(z%50===0||z===0||z===100?0.55:0.35));}
    for(let z=1;z<100;z++){if(z%5===0)continue;for(const x of[-HALF+0.3,-HASH-0.5,HASH,HALF-1.3])c.fillRect(X(x),Z(z)-PX*0.12,PX,PX*0.24);}
    // 6-ft white border outside the sidelines and end lines
    c.fillRect(X(HALF+2),Z(-12),2*PX,124*PX);c.fillRect(X(-HALF),Z(-12),2*PX,124*PX);c.fillRect(X(HALF+2),Z(-12),(2*HALF+4)*PX,2*PX);c.fillRect(X(HALF+2),Z(110),(2*HALF+4)*PX,2*PX);
    // yard numbers: 2 yds tall, tops 9 yds in from the sideline, with direction arrows
    c.font=`bold ${2.1*PX}px "Arial Narrow",Arial`;c.textAlign='center';c.textBaseline='middle';
    for(let z=10;z<100;z+=10){const n=z<=50?z:100-z;for(const sd of[-1,1]){const xc=sd*(HALF-10);c.save();c.translate(X(xc),Z(z));c.rotate(sd*Math.PI/2);
      c.fillText(String(n).split('').join('  '),0,0);
      if(n!==50){const dir=(z<50?-1:1)*sd;c.beginPath();c.moveTo(dir*2.6*PX,-0.9*PX);c.lineTo(dir*3.3*PX,-0.9*PX+(0));c.lineTo(dir*2.6*PX,-0.9*PX+0.6*PX);c.closePath();c.fill();}
      c.restore();}}
    // team-area dashes on the sideline
    for(let z=32;z<=68;z+=1){if(z%2)continue;for(const sd of[-1,1])c.fillRect(X(sd*(HALF+5)),Z(z),PX*0.25,PX*0.7);}
    // try line (2-yard line)
    for(const z of[2,98])c.fillRect(X(1),Z(z)-PX*0.15,2*PX,PX*0.3);
    // midfield logo
    c.save();c.translate(X(0),Z(50));c.beginPath();c.arc(0,0,4.5*PX,0,7);c.fillStyle=team.jersey;c.globalAlpha=0.8;c.fill();c.globalAlpha=1;c.lineWidth=PX*0.5;c.strokeStyle='#fff';c.stroke();
    c.fillStyle='#fff';c.font=`${2.6*PX}px "Oswald","Arial Narrow",Arial`;c.fillText(team.name.toUpperCase().slice(0,6),0,0,8*PX);c.restore();
  });
}

function buildStadium(){
  const L=[[-36,-26],[36,-26],[36,136],[-36,136]]; // inner rectangle corners (x,z)
  const R=[[-66,-56],[66,-56],[66,166],[-66,166]];
  for(let i=0;i<4;i++){const a=L[i],b=L[(i+1)%4],A2=R[i],B2=R[(i+1)%4];
    const len_=Math.hypot(b[0]-a[0],b[1]-a[1]);
    quad([[a[0],0,a[1]],[b[0],0,b[1]],[b[0],2.4,b[1]],[a[0],2.4,a[1]]],wallMat);
    quad([[a[0],2.4,a[1]],[b[0],2.4,b[1]],[B2[0],34,B2[1]],[A2[0],34,A2[1]]],standMat,len_/14,4);
    quad([[A2[0],34,A2[1]],[B2[0],34,B2[1]],[B2[0],38,B2[1]],[A2[0],38,A2[1]]],ribbonMat,len_/40,1);
    const A3=[A2[0]*1.28,A2[1]<55?A2[1]-22:A2[1]+22],B3=[B2[0]*1.28,B2[1]<55?B2[1]-22:B2[1]+22];
    quad([[A2[0],38,A2[1]],[B2[0],38,B2[1]],[B3[0],58,B3[1]],[A3[0],58,A3[1]]],standMat2,len_/14,3);
    quad([[A3[0],58,A3[1]],[B3[0],58,B3[1]],[B3[0],64,B3[1]],[A3[0],64,A3[1]]],rimMat);}
  // ad ring
  const adTex=canvasTex(1024,64,(c,w,h)=>{const ads=['END ZONE!','HUT HUT','TOUCHDOWN','QB1','BIG PLAY','PRIME TIME'];const cols=[['#ffd23f','#111'],['#1b4fd8','#fff'],['#d7263d','#fff'],['#111','#ffd23f']];
    for(let i=0;i<6;i++){const[bg,fg]=cols[i%4];c.fillStyle=bg;c.fillRect(i*w/6,0,w/6,h);c.fillStyle=fg;c.font='44px "Oswald","Arial Narrow",Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(ads[i],i*w/6+w/12,h/2+2,w/6-12);}},{repeat:true});
  const adMat=new THREE.MeshBasicMaterial({map:adTex,side:THREE.DoubleSide});
  for(let i=0;i<4;i++){const a=L[i],b=L[(i+1)%4];const len_=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const ins=0.6;const ax=a[0]-Math.sign(a[0])*ins,az=a[1]-Math.sign(a[1]-55)*ins,bx=b[0]-Math.sign(b[0])*ins,bz=b[1]-Math.sign(b[1]-55)*ins;
    quad([[ax,0.1,az],[bx,0.1,bz],[bx,1.4,bz],[ax,1.4,az]],adMat,len_/60,1);}

  const glowTex=canvasTex(128,128,(c,w,h)=>{const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,250,230,1)');g.addColorStop(0.2,'rgba(255,240,200,.5)');g.addColorStop(1,'rgba(255,240,200,0)');c.fillStyle=g;c.fillRect(0,0,w,h);});
  const poleMat=new THREE.MeshLambertMaterial({color:0x2a2f40});

}

function poseRun(p,dt){
  const m=p.mesh,sp=Math.hypot(p.vel.x,p.vel.z);p.phase+=sp*dt*1.9;
  const amp=clamp(sp/7,0,1);const s=Math.sin(p.phase);
  m.legs[0].hip.rotation.x=s*0.9*amp;m.legs[1].hip.rotation.x=-s*0.9*amp;
  m.legs[0].knee.rotation.x=Math.max(0,-Math.cos(p.phase))*1.3*amp+0.05;m.legs[1].knee.rotation.x=Math.max(0,Math.cos(p.phase))*1.3*amp+0.05;
  m.arms[0].sh.rotation.x=-s*0.8*amp;m.arms[1].sh.rotation.x=s*0.8*amp;m.arms[0].el.rotation.x=-0.9*amp-0.2;m.arms[1].el.rotation.x=-0.9*amp-0.2;
  m.arms[0].sh.rotation.z=-0.12;m.arms[1].sh.rotation.z=0.12;
  m.body.rotation.x=0.2*amp;m.body.position.y=Math.abs(Math.cos(p.phase))*0.06*amp;
}
function poseStance(p,t){ // linemen / ready stance
  const m=p.mesh;const c=p.crouch;m.body.position.y=-0.32*c;m.body.rotation.x=0.65*c;
  for(const l of m.legs){l.hip.rotation.x=-0.95*c;l.knee.rotation.x=1.25*c;}
  for(const a of m.arms){a.sh.rotation.x=-0.9*c;a.el.rotation.x=-0.3*c;}
}

function pickCoverage(){const sk=G.lvl.s;const w={C1:3,C2:2.4,C3:3,C4:0.8+sk*2.5,C0:G.lvl.blitz?3:0.2+sk*0.8};
  // the defense remembers what you've been calling this drive
  const last=G.calls.slice(-4);for(const name of new Set(last)){const n=last.filter(x=>x===name).length;const c=COUNTER[name]||{};
    for(const k in c)w[k]*=1+c[k]*n*(0.35+sk*0.6);}
  let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<=0)return k;}return 'C3';}

function kitFor(team,n,o={}){return{jersey:team.jersey,pants:team.pants,helmet:team.helmet,accent:team.accent,skin:o.skin||pick(SKINS),num:String(n),big:o.big,gloves:o.gloves};}
function clearPlayers(){for(const p of G.players){scene.remove(p.mesh.g);if(p.labelSprite)scene.remove(p.labelSprite);}G.players=[];G.off=[];G.def=[];}
function addP(side,role,x,z,o={}){const team=side==='O'?myTeam():G.opp;const _sk=pick(SKINS);
  const num=o.num??(role==='QB'?S.number:Math.floor(rnd(10,99)));
  const p={side,role,pos:V(x,0,z),vel:V(),mesh:makePlayer(kitFor(team,num,Object.assign({skin:_sk},o))),phase:Math.random()*6,crouch:0,max:o.max||7.5,acc:o.acc||22,face:side==='O'?0:Math.PI,
    skin:null,route:null,wp:0,stun:0,engaged:null,hist:[],fall:0,cel:0,name:o.name||role};
  p.skin=_sk;scene.add(p.mesh.g);G.players.push(p);(side==='O'?G.off:G.def).push(p);return p;}

function setupFormation(){
  clearPlayers();const L=G.los;
  const qb=addP('O','QB',0,L-6.5,{max:6.5});G.qb=qb;
  for(const x of[-2.8,-1.4,0,1.4,2.8])addP('O','OL',x,L-0.9,{big:true,max:5.5});
  const wr1=addP('O','WR1',-13,L-0.6,{max:8.8,gloves:true}),wr2=addP('O','WR2',13,L-1.0,{max:8.8,gloves:true}),wr3=addP('O','WR3',-7.5,L-1.0,{max:8.6,gloves:true});
  const te=addP('O','TE',4.4,L-0.9,{max:7.6,gloves:true}),rb=addP('O','RB',2.4,L-5.8,{max:8.4,gloves:true});
  G.elig=[wr1,wr2,wr3,te,rb];G.elig.forEach((p,i)=>{p.label=['A','B','C','D','E'][i];p.color=RCOL[i];});
  const sk=G.lvl.s;
  for(const x of[-3.6,-1.2,1.2,3.6])addP('D','DL',x,L+0.9,{big:true,max:6.2});
  const lbl=addP('D','LB',-4,L+5,{max:7.2}),lbm=addP('D','LB',0,L+5.5,{max:7.2}),lbr=addP('D','LB',4.5,L+5,{max:7.2});
  const cb1=addP('D','CB',-13,L+6,{max:8.2+sk*0.9}),cb2=addP('D','CB',13,L+6,{max:8.2+sk*0.9});
  const s1=addP('D','S',-9,L+14,{max:8+sk*0.6}),s2=addP('D','S',9,L+14,{max:8+sk*0.6});
  const cov=G.cov=pickCoverage();const M=r=>({t:'man',m:r}),RUSH={t:'rush'};
  const J={C0:[[cb1,M(wr1)],[cb2,M(wr2)],[s1,M(wr3)],[lbr,M(te)],[s2,M(rb)],[lbl,RUSH],[lbm,RUSH]],
    C1:[[cb1,M(wr1)],[cb2,M(wr2)],[lbl,M(wr3)],[lbr,M(te)],[lbm,M(rb)],[s1,Z(0,17,34,true)],[s2,Z(0,9,14,false)]],
    C2:[[cb1,Z(-14,5,10,false)],[cb2,Z(14,5,10,false)],[s1,Z(-11,18,26,true)],[s2,Z(11,18,26,true)],[lbl,Z(-6,8,9,false)],[lbm,Z(0,12,10,false)],[lbr,Z(6,8,9,false)]],
    C3:[[cb1,Z(-15,16,18,true)],[cb2,Z(15,16,18,true)],[s1,Z(0,18,18,true)],[s2,Z(9,6,11,false)],[lbl,Z(-9,6,11,false)],[lbm,Z(0,8,9,false)],[lbr,Z(4,8,9,false)]],
    C4:[[cb1,Z(-15,16,12,true)],[s1,Z(-5,16,12,true)],[s2,Z(5,16,12,true)],[cb2,Z(15,16,12,true)],[lbl,Z(-9,6,11,false)],[lbm,Z(0,8,10,false)],[lbr,Z(9,6,11,false)]]}[cov];
  for(const[d,j]of J){d.job=j;d.man=j.t==='man'?j.m:null;d.blitz=j.t==='rush';}
  // pre-snap shell: one-high (C0/C1/C3) or two-high (C2/C4); good defenses sometimes disguise it
  let showHigh=['C2','C4'].includes(cov)?2:1;if(Math.random()<sk-0.35)showHigh=3-showHigh;
  if(cov==='C0'){s1.pos.set(wr3.pos.x+1,0,L+5);s2.pos.set(2,0,L+6);}
  else if(showHigh===2){s1.pos.set(-10,0,L+13);s2.pos.set(10,0,L+13);}else{s1.pos.set(0,0,L+14);s2.pos.set(7,0,L+8);}
  if(cov==='C2'){cb1.pos.z=L+2;cb2.pos.z=L+2;} // corners squat in Cover 2
  for(const d of G.def){d.lag=lerp(0.5,0.2,sk);d.cush=lerp(2.2,1.0,sk);d.react=lerp(0.42,0.18,sk);}
  for(const p of G.players){p.face=p.side==='O'?0:Math.PI;if(p.role==='OL'||p.role==='DL')p.crouch=1;else if(p.role!=='QB')p.crouch=0.45;place(p);}
  G.ball.state='held';G.ball.holder=qb;
  losLine.position.z=L;fdLine.position.z=G.fdz;fdLine.visible=G.fdz<100;
  setPlay(G.playIdx);
}
function routePts(p,name){const sd=Math.sign(p.pos.x)||1;const out=sd,inn=-sd;const pts=[];
  for(const w of ROUTES[name]){let x,z;if(w[0]==='o'){x=p.pos.x+out*w[1];z=p.pos.z+w[2];}else if(w[0]==='i'){x=p.pos.x+inn*w[1];z=p.pos.z+w[2];}else{x=p.pos.x+w[0];z=p.pos.z+w[1];}
    pts.push(V(clamp(x,-HALF+1,HALF-1),0,Math.min(z,109)));}return pts;}
function setPlay(i){
  const names=G.lvl.plays||PLAYNAMES;G.playIdx=clamp(i,0,names.length-1);const play=PLAYS[names[G.playIdx]];
  routeGroup.clear();
  for(const p of G.elig){if(p.labelSprite){scene.remove(p.labelSprite);p.labelSprite=null;}const key=p.role;p.routeName=play[key];p.route=routePts(p,p.routeName);p.wp=0;
    const pts=[V(p.pos.x,0.06,p.pos.z),...p.route.map(q=>V(q.x,0.06,q.z))];
    const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',0.05);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.11,5,false),new THREE.MeshBasicMaterial({color:p.color,transparent:true,opacity:0.9,depthWrite:false}));routeGroup.add(tube);
    const end=pts[pts.length-1],prev=pts[pts.length-2];const cone=new THREE.Mesh(new THREE.ConeGeometry(0.45,0.9,10),new THREE.MeshBasicMaterial({color:p.color}));
    cone.position.copy(end);const d=end.clone().sub(prev).normalize();cone.quaternion.setFromUnitVectors(V(0,1,0),d);routeGroup.add(cone);
    const lab=labelSprite(p.label,p.color);lab.position.set(p.pos.x,2.7,p.pos.z);scene.add(lab);p.labelSprite=lab;}
  renderPlayCards();
}
function place(p){p.mesh.g.position.set(p.pos.x,0,p.pos.z);p.mesh.g.rotation.y=p.face;}

/* ---------------- simulation ---------------- */
function steer(p,target,speed,dt){const dx=target.x-p.pos.x,dz=target.z-p.pos.z,d=Math.hypot(dx,dz);
  let tx=0,tz=0;if(d>0.05){const s=Math.min(speed,d*4);tx=dx/d*s;tz=dz/d*s;}
  const ax=tx-p.vel.x,az=tz-p.vel.z,al=Math.hypot(ax,az),mx=p.acc*dt;if(al>mx){p.vel.x+=ax/al*mx;p.vel.z+=az/al*mx;}else{p.vel.x=tx;p.vel.z=tz;}}
function integrate(p,dt){p.pos.x+=p.vel.x*dt;p.pos.z+=p.vel.z*dt;p.hist.push({t:G.t,x:p.pos.x,z:p.pos.z});if(p.hist.length>90)p.hist.shift();
  const sp=Math.hypot(p.vel.x,p.vel.z);if(sp>0.6){const want=Math.atan2(p.vel.x,p.vel.z);let d=want-p.face;d=Math.atan2(Math.sin(d),Math.cos(d));p.face+=d*Math.min(1,dt*10);}}
function past(p,lag){const tt=G.t-lag;for(let i=p.hist.length-1;i>=0;i--)if(p.hist[i].t<=tt)return p.hist[i];return p.hist[0]||{x:p.pos.x,z:p.pos.z};}
function routeTarget(p){if(p.wp<p.route.length){const q=p.route[p.wp];if(hd(p.pos,q)<0.7)p.wp++;}
  if(p.wp<p.route.length)return p.route[p.wp];
  if(STOPS.includes(p.routeName))return V(p.pos.x,0,p.pos.z-0.3);
  const a=p.route[p.route.length-2]||p.pos,b=p.route[p.route.length-1];const d=V(b.x-a.x,0,b.z-a.z).normalize();return V(p.pos.x+d.x*6,0,Math.min(109,p.pos.z+d.z*6));}

function simPocket(dt){
  const qb=G.qb;const L=G.los;
  // QB drop
  if(!G.sacked){steer(qb,V(qb.pos.x,0,L-8.5),5,dt);}
  // line play
  const ol=G.off.filter(p=>p.role==='OL'),dl=G.def.filter(p=>p.role==='DL');
  G.pressT+=dt;const pr=G.pressT/G.pressMax;
  dl.forEach((d,i)=>{const o=ol[Math.min(ol.length-1,Math.round(i*1.3))];
    if(d.free){steer(d,qb.pos,7,dt);}
    else{const push=Math.min(2.6,pr*2.6);steer(d,V(d.pos.x*0.95,0,L+0.3-push),2,dt);if(o)steer(o,V(o.pos.x,0,d.pos.z-0.9),3,dt);d.phase+=dt*4;}});
  if(pr>=1&&!dl.some(d=>d.free)){const d=dl.reduce((a,b)=>Math.abs(a.pos.x)<Math.abs(b.pos.x)?a:b);d.free=true;d.crouch=0;}
  // receivers
  for(const p of G.elig){steer(p,routeTarget(p),p.max,dt);}
  // coverage
  for(const d of G.def){
    if(d.role==='DL'||d.stun>0)continue;
    if(d.blitz){steer(d,qb.pos,G.pressT>0.6?6.6:2.5,dt);continue;}
    if(d.man){const h=past(d.man,d.lag);const c=lerp(d.cush,-1.3*(1-G.lvl.s),clamp(G.pressT/1.6,0,1));steer(d,V(h.x+(d.man.pos.x>0?-0.5:0.5),0,h.z+c),d.max,dt);}
    else if(d.job&&d.job.t==='zone')steer(d,zoneTarget(d),d.max,dt);
    else steer(d,V(qb.pos.x*0.5,0,L+5),5,dt);
  }
  // sack
  for(const d of G.def){if((d.free||d.blitz)&&hd(d.pos,qb.pos)<0.9&&G.phase==='pocket'){sack(d);return;}}
}
/* Zone defense: drop to your landmark, then take the most dangerous receiver in your area.
   Deep defenders stay on top of anyone running deep; underneath defenders sit in front. */
function zoneTarget(d){const j=d.job,L=G.los;const base=V(j.x,0,Math.min(L+j.dz,108));let thr=null,tv=-1e9;
  for(const r of G.elig){const inX=Math.abs(r.pos.x-j.x)<j.w/2+2;
    if(j.deep){if(inX&&r.pos.z>L+5&&r.pos.z>tv){tv=r.pos.z;thr=r;}}
    else{const dz=r.pos.z-(L+j.dz);if(inX&&Math.abs(dz)<7&&r.pos.z>L-1){const v=-Math.hypot(r.pos.x-j.x,dz);if(v>tv){tv=v;thr=r;}}}}
  if(!thr)return base;
  if(j.deep)return V(clamp(lerp(base.x,thr.pos.x,0.8),j.x-j.w/2-2,j.x+j.w/2+2),0,Math.min(109,Math.max(base.z,thr.pos.z+2.6+thr.vel.z*0.3)));
  return V(lerp(base.x,thr.pos.x,0.75),0,clamp(thr.pos.z-0.8,L+1,L+j.dz+4));}
function simAir(dt){
  const b=G.ball;b.t+=dt;
  const tgt=G.target;
  for(const p of G.elig){if(p===tgt){const rem=Math.max(0.05,b.T-b.t);const d=hd(p.pos,b.to);steer(p,b.to,Math.min(p.max*1.25,d/rem+1),dt);}else steer(p,routeTarget(p),p.max,dt);}
  for(const d of G.def){if(d.role==='DL'){if(d.free)steer(d,G.qb.pos,6,dt);continue;}
    // defenders who can get there break on the ball once they read it
    const dist=hd(d.pos,b.to),rem=Math.max(0.05,b.T-b.t);const canGet=dist/d.max<rem+0.6;
    const mine=(d.man&&d.man===tgt)||(d.job&&d.job.t==='zone'&&Math.abs(b.to.x-d.job.x)<d.job.w/2+4&&(d.job.deep?b.to.z>G.los+9:b.to.z<G.los+d.job.dz+9));
    if((mine||canGet&&dist<16)&&b.t>d.react){steer(d,b.to,d.max*1.02,dt);}
    else if(d.man){const h=past(d.man,d.lag);steer(d,V(h.x,0,h.z-1.3*(1-G.lvl.s)),d.max,dt);}
    else if(d.job&&d.job.t==='zone')steer(d,zoneTarget(d),d.max,dt);else steer(d,b.to,d.max*0.6,dt);}
  steer(G.qb,G.qb.pos,3,dt);
  // star collected by the ball in flight
  if(G.star&&ballPos(b.t/b.T).distanceTo(G.star)<1.4)grabStar();
  if(b.t>=b.T)resolveCatch();
}
function ballPos(f){const b=G.ball;const p=b.from.clone().lerp(b.to,f);p.y=lerp(b.from.y,b.to.y,f)+b.apex*4*f*(1-f);return p;}
function resolveCatch(){
  const b=G.ball,land=b.to;
  let rec=null,rd=1e9;for(const p of G.elig){const d=hd(p.pos,land);if(d<rd){rd=d;rec=p;}}
  let df=null,dd=1e9;for(const p of G.def){if(p.role==='DL')continue;const d=hd(p.pos,land);if(d<dd){dd=d;df=p;}}
  const inb=Math.abs(land.x)<HALF&&land.z<110;
  if(rec&&rd<1.7&&inb){
    const hang=G.ball.T>1.5?0.15:0;
    if(df&&dd<0.9&&dd<rd-0.3){if(Math.random()<0.2+G.lvl.s*0.15+hang)return intercept(df);return incomplete('BROKEN UP!');}
    if(df&&dd<0.9&&Math.random()<0.25)return incomplete('BROKEN UP!');
    return caught(rec,df&&dd<1.6);
  }
  if(df&&dd<1.2&&inb&&Math.random()<0.32+G.lvl.s*0.2+(G.ball.T>1.5?0.15:0))return intercept(df);
  incomplete(inb?'INCOMPLETE':'OUT OF BOUNDS');
}
function caught(p,contested){
  G.phase='run';G.runner=p;G.ball.state='held';G.ball.holder=p;routeGroup.visible=false;
  A.catch();buzz(18);G.hitstop=0.07;A.swell(0.1,2.5);emit(V(p.pos.x,1.5,p.pos.z),18,'#ffffff',4,0.6);
  if(p.pos.z>=100){touchdown(true);return;}
  say(contested?'WHAT A CATCH!':'CAUGHT!',contested?'':'cool','');G.shake=contested?0.5:0.25;
  // offensive players become blockers
  for(const o of G.off){if(o!==p&&o!==G.qb)o.block=true;}
  aimDots.visible=aimRing.visible=lockRing.visible=false;qbRing.visible=false;
}
function simRun(dt){
  const r=G.runner;if(!r)return;
  const fwd=r.max*(G.juke>0?1.3:1.0);
  let vx=0;if(G.steer){vx=clamp((G.steer.x-G.steer.x0)/(W*0.2),-1,1)*7.5*G.steerSign;}
  const tgt=V(r.pos.x+vx*0.5,0,r.pos.z+fwd*0.5);steer(r,tgt,Math.hypot(vx,fwd),dt);
  if(G.juke>0)G.juke-=dt;if(G.jukeCd>0)G.jukeCd-=dt;
  // blockers
  for(const o of G.off){if(!o.block)continue;if(o.engaged){o.engT-=dt;if(o.engT<=0||o.engaged.stun<=0){o.engaged=null;}else{steer(o,o.engaged.pos,3,dt);continue;}}
    let best=null,bd=12;for(const d of G.def){if(d.stun>0)continue;const dd=hd(o.pos,d.pos);const toR=hd(d.pos,r.pos);if(dd<bd&&toR<16){bd=dd;best=d;}}

/* ---------------- camera ---------------- */
function viewDir(){return V(Math.sin(G.yaw)*Math.cos(G.pitch),Math.sin(G.pitch),Math.cos(G.yaw)*Math.cos(G.pitch));}
function fpView(){return G.mode==='career'&&G.qb&&!G.runner&&!G.picked&&['presnap','pocket','air','dead'].includes(G.phase);}

  if(fp){
    const e=eyePos().add(V(0,1.0,-2.8));G.yaw=0;G.pitch=W<H?-0.27:-0.19;camera.position.copy(e);camera.up.set(0,1,0);camera.lookAt(e.clone().add(viewDir()));

    if(G.shake>0){camera.rotateZ(rnd(-1,1)*G.shake*0.03);camera.rotateX(rnd(-1,1)*G.shake*0.02);G.shake=Math.max(0,G.shake-dt*2);}
    cam.pos.copy(e);cam.look.copy(e.clone().add(viewDir().multiplyScalar(10)));
    const f=e.clone().add(V(Math.sin(G.yaw)*14,0,Math.cos(G.yaw)*14));sun.target.position.set(f.x,0,f.z);sun.position.set(f.x-25,55,f.z-30);
    return;}
  if(G.mode==='attract'){const a=G.t*0.07;cam.tPos.set(Math.sin(a)*40,14,70+Math.cos(a)*30);cam.tLook.set(0,2,85);}
  else if((G.phase==='run'||G.phase==='dead')&&G.runner){const r=G.runner;cam.tLook.set(r.pos.x,1.3,r.pos.z+6);cam.tPos.set(r.pos.x*0.96,2.7,r.pos.z-4.3);}
  else if(G.picked){const r=G.picked;cam.tLook.set(r.pos.x,1.2,r.pos.z);cam.tPos.set(r.pos.x,4,r.pos.z+8);}
  else if(G.phase==='td'&&G.runner){const r=G.runner;const a=G.tdT*0.6;cam.tLook.set(r.pos.x,1.4,r.pos.z);cam.tPos.set(r.pos.x+Math.sin(a)*7,2.6,r.pos.z-Math.cos(a)*7);}

}

/* ---------------- input ---------------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function groundAt(x,y){ndc.set(x/W*2-1,-(y/H)*2+1);ray.setFromCamera(ndc,camera);const d=ray.ray.direction,o=ray.ray.origin;if(d.y>=-1e-4)return null;const t=-o.y/d.y;return o.clone().addScaledVector(d,t);}
function planeZAt(x,y,z){ndc.set(x/W*2-1,-(y/H)*2+1);ray.setFromCamera(ndc,camera);const d=ray.ray.direction,o=ray.ray.origin;if(d.z<=1e-4)return null;const t=(z-o.z)/d.z;return o.clone().addScaledVector(d,t);}
const BALLSPD=21,CATCHY=1.25,GRAV=10.7;
const AIMUP=70;
function fingerTarget(x,y){ndc.set(x/W*2-1,-((y-AIMUP)/H)*2+1);ray.setFromCamera(ndc,camera);const d=ray.ray.direction,o=ray.ray.origin;const qb=G.qb.pos;let T;
  if(d.y<-0.002){const t=(CATCHY-o.y)/d.y;T=o.clone().addScaledVector(d,t);}else{const h=V(d.x,0,d.z).normalize();T=o.clone().addScaledVector(h,70);T.y=CATCHY;}
  let dx=T.x-qb.x,dz=T.z-qb.z,dist=Math.hypot(dx,dz);
  if(dist<4){const k=4/Math.max(0.01,dist);dx*=k;dz*=k;dist=4;}if(dist>62){const k=62/dist;dx*=k;dz*=k;}
  return V(qb.x+dx,CATCHY,qb.z+dz);}
function aimPoint(){const e=eyePos(),d=viewDir();let T;
  if(d.y<-0.003){const t=(CATCHY-e.y)/d.y;T=e.clone().addScaledVector(d,t);}else{const h=V(d.x,0,d.z).normalize();T=e.clone().addScaledVector(h,60);T.y=CATCHY;}
  const dist=hd(e,T);if(dist>65){const k=65/dist;T.x=e.x+(T.x-e.x)*k;T.z=e.z+(T.z-e.z)*k;}return T;}

  for(let t=0;t<T;t+=st){const tg=routeTarget(q);const dx=tg.x-q.pos.x,dz=tg.z-q.pos.z,d=Math.hypot(dx,dz);if(d>0.01){const m=Math.min(d,p.max*st);q.pos.x+=dx/d*m;q.pos.z+=dz/d*m;}}return q.pos;}
function throwFP(power,T0){
  if(G.phase!=='pocket')return;const T=T0||aimPoint();const qb=G.qb;
  const from=V(qb.pos.x+0.35,2.2,qb.pos.z+0.2);
  const dist=from.distanceTo(T);const speed=lerp(14,27,power);const Tm=Math.max(0.3,dist/speed);
  const apex=GRAV*Tm*Tm/8;

  let best=null,bd=7;for(const p of G.elig){const pr=predictRoute(p,Tm);const d=Math.min(hd(pr,T),hd(p.pos,T)*1.1);const reach=hd(p.pos,T)/Tm<=p.max*1.4;if(d<bd&&reach){bd=d;best=p;}}
  doThrow({from,to:T,T:Tm,apex,lock:best});G.throwAnim=0;G.lastPower=power;}
/* Swipe to throw. Where the swipe ENDS (left/right) = direction. How LONG it is = distance.
   How FAST the flick is = bullet or lob. Up/down position on screen does not change distance. */
function swipeThrow(sw,h){
  const dx=sw.x-sw.x0,dy=sw.y-sw.y0,L=Math.hypot(dx,dy);if(dy>-25||L<40)return;
  const end=h[h.length-1]||{x:sw.x,y:sw.y,t:performance.now()};let o=h[0]||end;for(const q of h){if(end.t-q.t<=110){o=q;break;}}if(o===end&&h.length>1)o=h[h.length-2];
  const v=Math.hypot(end.x-o.x,end.y-o.y)/Math.max(16,end.t-o.t);const power=clamp((v-0.4)/2.4,0,1);
  const ref=Math.max(W,H)*0.72;const dist=clamp(5+(L/ref)*48+power*5,5,62);
  // direction: the camera ray through the end of the swipe, flattened onto the field
  ndc.set(clamp(sw.x,0,W)/W*2-1,0);ray.setFromCamera(ndc,camera);const dir=V(ray.ray.direction.x,0,ray.ray.direction.z).normalize(),C=ray.ray.origin,q=G.qb.pos;
  // point along that line whose distance from the QB is 'dist'
  const fx=C.x-q.x,fz=C.z-q.z,b=fx*dir.x+fz*dir.z,c=fx*fx+fz*fz-dist*dist,disc=b*b-c;const t=disc>0?-b+Math.sqrt(disc):dist;
  const T=V(C.x+dir.x*t,CATCHY,C.z+dir.z*t);
  throwFP(power,T);
  const kind=power>0.7?'BULLET':power<0.3?'LOB':'';floatThrow(`${Math.round(dist)} YD${kind?' · '+kind:''}`);
}
function floatThrow(txt){const el=$('#throwTxt');el.textContent=txt;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}
function throwPlan(T){const qb=G.qb;const from=V(qb.pos.x+0.3,2.2,qb.pos.z);const dist=hd(from,T);const Tm=Math.max(0.45,dist/BALLSPD+0.12);
  // lock-on: snap to where a receiver will be when the ball gets there
  let lock=null,ld=1e9,lp=null;
  for(const p of G.elig){const pred=V(clamp(p.pos.x+p.vel.x*Tm,-HALF+0.5,HALF-0.5),0,Math.min(109,p.pos.z+p.vel.z*Tm));
    const d=Math.min(hd(pred,T),hd(p.pos,T)+1.5);if(d<4.2&&d<ld){ld=d;lock=p;lp=pred;}}
  const to=lock?lp:V(T.x,0,T.z);const dd=hd(from,to);const T2=Math.max(0.45,dd/BALLSPD+0.12);
  return{from,to:V(to.x,1.4,to.z),T:T2,apex:1+dd*0.11,lock};}
function showAim(plan){aimDots.visible=aimRing.visible=true;const m=new THREE.Matrix4();const b0=G.ball;
  for(let i=0;i<30;i++){const f=(i+1)/31;const p=plan.from.clone().lerp(plan.to,f);p.y=lerp(plan.from.y,plan.to.y,f)+plan.apex*4*f*(1-f);m.makeTranslation(p.x,p.y,p.z);aimDots.setMatrixAt(i,m);}

function mkBtn(t,cls,f){const b=document.createElement('button');b.className='btn '+(cls||'primary');b.innerHTML=`<span>${t}</span>`;b.onclick=()=>{A.init();A.tap();f();};return b;}

  const tm=myTeam();if(ribbonMat.map)ribbonMat.map.dispose();ribbonMat.map=canvasTex(1024,64,(c,w,h)=>{const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,tm.jersey);g.addColorStop(1,'#000');c.fillStyle=g;c.fillRect(0,0,w,h);
    c.fillStyle='#fff';c.font='40px "Oswald","Arial Narrow",Arial';c.textBaseline='middle';for(let i=0;i<4;i++)c.fillText(`${tm.name.toUpperCase()} ★ END ZONE ★`,i*256+8,h/2+2,240);},{repeat:true});ribbonMat.needsUpdate=true;
  // sideline benches and teammates
  benchGroup.clear();
  for(const sd of[-1,1]){const team=sd<0?tm:G.opp;const bench=new THREE.Mesh(new THREE.BoxGeometry(1,0.5,24),new THREE.MeshLambertMaterial({color:0x22283a}));bench.position.set(sd*(HALF+7),0.25,50);benchGroup.add(bench);
    const cooler=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.7,14),new THREE.MeshLambertMaterial({color:0xff7a00}));cooler.position.set(sd*(HALF+5.8),0.35,38);benchGroup.add(cooler);
    for(let i=0;i<5;i++){const m=makePlayer(kitFor(team,Math.floor(rnd(10,99)),{}));m.g.position.set(sd*(HALF+4.5+rnd(0,1.5)),0,40+i*4.5+rnd(-1,1));m.g.rotation.y=sd<0?Math.PI/2:-Math.PI/2;
      m.g.traverse(o=>{if(o.isMesh)o.castShadow=false;});for(const a of m.arms)a.sh.rotation.z=a.sh.position.x>0?0.15:-0.15;benchGroup.add(m.g);}}
  updBoard();}

const boardCanvas=document.createElement('canvas');boardCanvas.width=512;boardCanvas.height=224;const boardTex=new THREE.CanvasTexture(boardCanvas);boardTex.colorSpace=THREE.SRGBColorSpace;
{const g=new THREE.Group();const frame=new THREE.Mesh(new THREE.BoxGeometry(44,21,1.5),new THREE.MeshLambertMaterial({color:0x0b0f1c}));g.add(frame);
 const scr=new THREE.Mesh(new THREE.PlaneGeometry(42,18.4),new THREE.MeshBasicMaterial({map:boardTex}));scr.position.z=-0.8;scr.rotation.y=Math.PI;g.add(scr);
 const leg=new THREE.Mesh(new THREE.BoxGeometry(2,30,2),new THREE.MeshLambertMaterial({color:0x1a1f30}));leg.position.y=-25;g.add(leg);
 g.position.set(0,52,150);scene.add(g);}
function updBoard(big){const c=boardCanvas.getContext('2d'),w=512,h=224,tm=myTeam(),op=G.opp||TEAMS[1];
  c.fillStyle='#05070f';c.fillRect(0,0,w,h);

    c.fillStyle='#fff';c.font='64px "Oswald","Arial Narrow",Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(big,w/2,h/2,w-30);boardTex.needsUpdate=true;return;}

  c.fillText(dd,w/2,130);c.fillStyle='#fff';c.font='30px "Oswald","Arial Narrow",Arial';c.fillText(G.mode==='career'?`BALL ON ${spot(G.los)}`:'END ZONE!',w/2,180);boardTex.needsUpdate=true;}
function goMenu(){attract();showScreen('menu');const tot=Object.values(S.stars).reduce((a,m)=>a+(m&1)+((m>>1)&1)+((m>>2)&1),0);$('#careerSub').textContent=`★ ${tot} / ${LEVELS.length*3} stars`;
  $('#fgSub').textContent=S.best.fg?`Longest make: ${S.best.fg} yards`:'How far can you kick it?';soundIcons();}
function showLevels(){attract();const g=$('#lvGrid');g.innerHTML='';LEVELS.forEach((L,i)=>{const st=S.stars[i]||0,un=i===0||(S.stars[i-1]||0)>0;const b=document.createElement('button');b.className='lv'+(un?'':' locked');

  b.onclick=()=>{A.init();if(!own){if(S.coins<t.price){toast('Not enough coins. Score more touchdowns!');return;}S.coins-=t.price;S.own.push(t.id);A.coin();toast(t.name+' unlocked!');}else A.tap();
    S.team=t.id;save();refreshCoins();renderTeams();attract();};box.appendChild(b);});}
