<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>END ZONE! QB Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#060c1c;color:#fff;touch-action:none;overscroll-behavior:none;
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
#fx{pointer-events:none;z-index:2}
#gl{z-index:1;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.disp{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;letter-spacing:.5px}
.glass{background:rgba(8,14,34,.78);border:2px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;gap:6px;align-items:center}
.pill{border-radius:12px;padding:5px 10px;font-weight:900;display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
.coin{display:inline-block;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#f5c518 45%,#b8860b);box-shadow:inset 0 0 0 2px rgba(120,80,0,.35);flex:none}
#dd{padding:0;overflow:hidden}
#hud .pill{font-size:13px}#dd b{padding:6px 9px;background:#ffd23f;color:#111;font-family:"Lilita One";font-weight:400;font-size:16px}
#dd i{padding:6px 8px;font-style:normal;font-size:13px}
.hbtn{pointer-events:auto;width:40px;height:36px;border-radius:12px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
#bPause{background:#1b4fd8;border:2px solid rgba(255,255,255,.25);box-shadow:0 3px 0 #0e2a78}
.hstar{font-size:17px;color:rgba(255,255,255,.25)}.hstar.on{color:#ffd23f;text-shadow:0 0 8px rgba(255,210,63,.7)}
#pressure{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);width:min(60vw,260px);height:10px;border-radius:6px;z-index:5;overflow:hidden;pointer-events:none}
#pressure i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5dff8a,#ffd23f 60%,#ff3b3b);border-radius:6px}
#pressure span{position:absolute;right:6px;top:-18px;font-size:11px;font-weight:900;opacity:.8}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 10px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#plays{display:flex;gap:8px;overflow-x:auto;max-width:100%;pointer-events:auto;padding:2px;touch-action:pan-x}
.play{flex:none;min-width:96px;padding:8px 10px;border-radius:14px;text-align:left;font-weight:900;font-size:12px;line-height:1.15}
.play .pn{font-family:"Lilita One";font-weight:400;font-size:15px;color:#ffd23f;display:block;margin-bottom:2px}
.play.on{border-color:#ffd23f;box-shadow:0 0 0 2px #ffd23f,0 6px 20px rgba(255,210,63,.3)}
#snap{pointer-events:auto;font-family:"Lilita One";font-size:30px;padding:12px 56px;border-radius:18px;color:#111;
  background:linear-gradient(180deg,#fff27a,#ffb800);box-shadow:0 6px 0 #a86f00,0 12px 24px rgba(0,0,0,.4);position:relative;overflow:hidden;animation:breathe 1.4s infinite}
#snap::after{content:"";position:absolute;left:6%;right:6%;top:3px;height:42%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}
#snap:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #a86f00}
@keyframes breathe{50%{transform:scale(1.04)}}
#hint{font-weight:900;font-size:15px;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.7);text-align:center}

#big{position:fixed;left:0;right:0;top:28%;z-index:6;text-align:center;pointer-events:none}
#big .w{display:inline-block;font-family:"Lilita One";font-size:min(16vw,96px);line-height:1;white-space:nowrap}
#big .l{display:inline-block;background:linear-gradient(180deg,#fffbd0,#ffd23f 50%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:3px #0b1530;filter:drop-shadow(0 6px 0 #0b1530) drop-shadow(0 0 18px rgba(255,180,0,.5));transform:scale(0);animation:lpop .55s cubic-bezier(.2,1.8,.4,1) forwards}
#big.bad .l{background:linear-gradient(180deg,#ffe0e0,#ff6b6b 50%,#b3122a);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 0 #0b1530)}
#big.cool .l{background:linear-gradient(180deg,#e0fbff,#5ad7ff 50%,#1b4fd8);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 0 #0b1530)}
#big .sub{font-weight:900;font-size:18px;margin-top:8px;text-shadow:0 2px 0 #000;opacity:0;animation:fadein .4s .45s forwards}
@keyframes lpop{60%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1) rotate(-3deg)}}
@keyframes fadein{to{opacity:1}}
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:4;pointer-events:none;width:min(92vw,460px);text-align:center;border-radius:16px;padding:10px 14px;transition:opacity .5s}
#banner .bt{font-family:"Lilita One";font-size:24px;color:#ffd23f}
#banner .bs{font-size:14px;margin-top:3px;line-height:1.3}
#banner .bo{font-size:12px;margin-top:6px;color:#9fd3ff;font-weight:900}

/* screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(180deg,rgba(4,8,22,.4),rgba(4,8,22,.88));overflow-y:auto;touch-action:pan-y}
.logo{margin-top:7vh;text-align:center;transform:rotate(-4deg)}
.logo .l1{font-family:"Lilita One";font-size:min(20vw,104px);line-height:.9;background:linear-gradient(180deg,#fff7b0,#ffd23f 45%,#ff7a00);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #0b1530;filter:drop-shadow(0 6px 0 #0b1530) drop-shadow(0 0 22px rgba(255,170,0,.45))}
.logo .l2{font-weight:900;font-size:min(4.6vw,20px);letter-spacing:4px;margin-top:8px;text-shadow:0 3px 0 #0b1530}
.menuBtns{display:flex;flex-direction:column;gap:14px;width:min(86vw,360px);margin-top:auto;margin-bottom:4vh}
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font-family:"Lilita One";font-size:24px;letter-spacing:.5px;text-transform:uppercase;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fff27a,#ffb800);color:#111;box-shadow:0 6px 0 #a86f00,0 10px 18px rgba(0,0,0,.35);transition:transform .12s cubic-bezier(.2,1.6,.4,1)}
.btn::after{content:"";position:absolute;left:5%;right:5%;top:3px;height:44%;border-radius:12px 12px 40% 40%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(4px) scale(.96)}
.btn small{display:block;font-family:"Nunito";font-weight:800;font-size:12px;letter-spacing:0;text-transform:none;opacity:.8}
.btn.blue{background:linear-gradient(180deg,#5aa0ff,#1b4fd8);color:#fff;box-shadow:0 6px 0 #0e2a78,0 10px 18px rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(180deg,#ff7a7a,#d7263d);color:#fff;box-shadow:0 6px 0 #7a1020,0 10px 18px rgba(0,0,0,.35)}
.btn.dark{background:linear-gradient(180deg,#3b4668,#222a44);color:#fff;box-shadow:0 6px 0 #11162a,0 10px 18px rgba(0,0,0,.35)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.94)}}
.screen:not(.hidden) .menuBtns .btn,.screen:not(.hidden) .lv,.screen:not(.hidden) .team{animation:rise .5s cubic-bezier(.2,1.35,.4,1) both}
.menuBtns .btn:nth-child(2){animation-delay:.07s!important}.menuBtns .btn:nth-child(3){animation-delay:.14s!important}
.topbar{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar h2{flex:1;margin:0;font-family:"Lilita One";font-weight:400;font-size:26px}
.back{width:44px;height:44px;border-radius:12px;font-size:26px;font-weight:900}
.menuTop{width:100%;display:flex;justify-content:space-between;align-items:center}
.iconBtn{width:44px;height:44px;border-radius:12px;font-size:20px}
#lvGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
.lv{background:linear-gradient(180deg,#22305e,#141c3c);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 6px;text-align:center;min-height:106px}
.lv .ln{font-family:"Lilita One";font-size:28px;color:#ffd23f;line-height:1}
.lv .lt{font-size:12px;font-weight:900;margin:5px 0;min-height:30px;line-height:1.2}
.lv .ls{font-size:16px;color:rgba(255,255,255,.22)}.lv .ls .on{color:#ffd23f}
.lv.locked{opacity:.4}
.card{margin:auto;width:min(90vw,380px);text-align:center;background:linear-gradient(180deg,rgba(36,50,96,.9),rgba(14,20,44,.95));
  border:2px solid rgba(255,255,255,.16);border-radius:22px;padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:scale(.7)}}
#rTitle{font-family:"Lilita One";font-size:38px;color:#ffd23f;line-height:1}
#rSub{font-size:14px;opacity:.85;margin-top:6px}
#rStars{font-size:54px;margin:12px 0 4px;letter-spacing:4px;color:rgba(255,255,255,.18)}
#rStars span{display:inline-block;transform:scale(0);animation:spop .45s forwards}
#rStars span.on{color:#ffd23f;text-shadow:0 0 16px rgba(255,210,63,.7)}
@keyframes spop{60%{transform:scale(1.35)}100%{transform:scale(1)}}
#rList{font-size:14px;text-align:left;margin:8px auto 0;max-width:270px;line-height:1.7}
#rList div{display:flex;justify-content:space-between}#rList .ok{color:#7dff9a}#rList .no{opacity:.45}
#rCoins{margin:12px auto 4px;display:inline-flex;gap:8px;align-items:center;font-weight:900;font-size:22px}
.rBtns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
#teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
.team{position:relative;border-radius:16px;padding:12px;text-align:left;border:3px solid transparent;min-height:84px;overflow:hidden}
.team.sel{border-color:#ffd23f}
.team .tn{font-family:"Lilita One";font-size:20px;position:relative}
.team .sw{display:flex;gap:4px;margin-top:6px;position:relative}.team .sw i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.team .pr{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);border-radius:10px;padding:3px 8px;font-weight:900;font-size:12px;display:flex;gap:4px;align-items:center}
#numRow{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
#numRow button{width:56px;height:56px;border-radius:14px;background:#1b4fd8;font-size:30px;font-weight:900}
#numRow span{font-family:"Lilita One";font-size:54px;min-width:90px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);z-index:30;background:#0b1530;border:2px solid #ffd23f;border-radius:12px;padding:9px 16px;font-weight:900;pointer-events:none;transition:opacity .3s;opacity:0}
#xhair{position:fixed;left:50%;top:50%;z-index:4;pointer-events:none;transform:translate(-50%,-50%);width:46px;height:46px}
#xhair i{position:absolute;inset:0;border:3px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.4)}
#xhair b{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
#xhair span{position:absolute;left:50%;top:54px;transform:translateX(-50%);font-family:"Lilita One";font-size:17px;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 8px #000}
#rot{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);z-index:5;pointer-events:none;background:rgba(8,14,34,.8);border:2px solid rgba(255,210,63,.6);border-radius:12px;padding:6px 12px;font-weight:900;font-size:13px;white-space:nowrap}
#xhair.hot i{border-color:#5dff8a}#xhair.hot span{color:#5dff8a}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;font-family:"Lilita One";font-size:28px;color:#ffd23f;background:#060c1c}
</style>

<body>
<canvas id="gl"></canvas><canvas id="fx"></canvas>
<div id="rot" class="hidden">↻ Turn your phone sideways to see the whole field</div>
<div id="xhair" class="hidden"><i></i><b></b><span id="xYd">20 YD</span></div>
<div id="loading">Loading stadium…</div>

<div id="hud" class="hidden">
  <div class="pill glass" id="dd"><b id="ddDown">1st &amp; 10</b><i id="ddSpot">OPP 25</i></div>
  <div style="flex:1"></div>
  <div class="pill glass" id="hStars"></div>
  <button class="hbtn glass" id="bMute" aria-label="Mute">🔊</button>
  <button class="hbtn" id="bPause" aria-label="Pause">II</button>
</div>
<div id="pressure" class="glass hidden"><span>POCKET</span><i></i></div>
<div id="banner" class="glass hidden"><div class="bt"></div><div class="bs"></div><div class="bo"></div></div>
<div id="big" class="hidden"></div>
<div id="bottom" class="hidden">
  <div id="hint"></div>
  <div id="plays"></div>
  <button id="snap">SNAP!</button>
</div>

<div id="menu" class="screen hidden">
  <div class="menuTop"><div class="pill glass"><span class="coin"></span><span class="cCoins">0</span></div><button class="iconBtn glass" id="bSound">🔊</button></div>
  <div class="logo"><div class="l1">END ZONE!</div><div class="l2">QB SHOWDOWN</div></div>
  <div class="menuBtns">
    <button class="btn" id="bCareer">Career<small id="careerSub">12 drives</small></button>
    <button class="btn blue" id="bFG">Field Goal Frenzy<small id="fgSub">How far can you kick it?</small></button>
    <button class="btn red" id="bLocker">Locker Room<small>Pick your team &amp; number</small></button>
  </div>
</div>
<div id="levels" class="screen hidden">
  <div class="topbar"><button class="back glass" data-go="menu">‹</button><h2>Career</h2><div class="pill glass"><span class="coin"></span><span class="cCoins">0</span></div></div>
  <div id="lvGrid"></div>
</div>
<div id="locker" class="screen hidden">
  <div class="topbar"><button class="back glass" data-go="menu">‹</button><h2>Locker Room</h2><div class="pill glass"><span class="coin"></span><span class="cCoins">0</span></div></div>
  <div id="numRow"><button id="nMinus">−</button><span id="nVal">7</span><button id="nPlus">+</button></div>
  <div id="teams"></div>
</div>
<div id="result" class="screen hidden"><div class="card"><div id="rTitle"></div><div id="rSub"></div><div id="rStars"></div><div id="rList"></div><div id="rCoins"></div><div class="rBtns" id="rBtns"></div></div></div>
<div id="pause" class="screen hidden"><div class="card"><div class="disp" style="font-size:40px">PAUSED</div><div class="rBtns">
  <button class="btn" id="pResume">Resume</button><button class="btn dark" id="pSound">Sound: On</button><button class="btn blue" id="pRetry">Restart</button><button class="btn dark" id="pQuit">Quit</button></div></div></div>
<div id="toast"></div>

<script type="module">
/* =====================================================================
   END ZONE! — an original 3D quarterback game (Three.js).
   Units are yards. x = across the field, y = up, z = downfield.
   Our offence attacks +z; their goal line is z = 100, end zone to z = 110.
   ===================================================================== */
import * as THREE from 'three';
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const hd=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const HALF=26.65, HASH=3.08;

/* ---------------- save ---------------- */
const SKEY='endzone_save_v1';
const S=(()=>{const d={coins:120,stars:{},team:'blaze',own:['blaze','tide'],number:7,sound:true,best:{fg:0}};
  try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)return Object.assign(d,s,{best:Object.assign(d.best,s.best||{})});}catch(e){}return d;})();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function refreshCoins(){document.querySelectorAll('.cCoins').forEach(e=>e.textContent=S.coins);}
function addCoins(n){S.coins+=n;save();refreshCoins();}

const TEAMS=[
 {id:'blaze',name:'Blaze',jersey:'#d7263d',pants:'#f2f2f2',helmet:'#c01d33',accent:'#ffd23f',price:0},
 {id:'tide',name:'Tide',jersey:'#1b4fd8',pants:'#d9dde6',helmet:'#0e2a78',accent:'#ffffff',price:0},
 {id:'venom',name:'Venom',jersey:'#1f9d55',pants:'#151515',helmet:'#151515',accent:'#b8ff3b',price:150},
 {id:'storm',name:'Storm',jersey:'#5b2bbd',pants:'#f0c030',helmet:'#f0c030',accent:'#ffffff',price:150},
 {id:'ice',name:'Ice',jersey:'#eaf4ff',pants:'#0b2545',helmet:'#9fd3ff',accent:'#0b2545',price:200},
 {id:'inferno',name:'Inferno',jersey:'#ff6a00',pants:'#151515',helmet:'#151515',accent:'#ffcc00',price:250},
 {id:'shadow',name:'Shadow',jersey:'#1a1a1a',pants:'#1a1a1a',helmet:'#2b2b2b',accent:'#ff2a6d',price:300},
 {id:'gold',name:'Gold Rush',jersey:'#d4af37',pants:'#ffffff',helmet:'#d4af37',accent:'#111111',price:500},
];
const SKINS=['#f1c27d','#e0ac69','#c68642','#8d5524','#5c3a1e'];
function hexRgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function cdist(a,b){const A_=hexRgb(a),B=hexRgb(b);return Math.hypot(A_[0]-B[0],A_[1]-B[1],A_[2]-B[2]);}
const myTeam=()=>TEAMS.find(t=>t.id===S.team)||TEAMS[0];

/* ---------------- audio ---------------- */
const A={ctx:null,master:null,noise:null,crowd:null,
  init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=this.ctx=new C();this.master=c.createGain();this.master.gain.value=S.sound?0.8:0;this.master.connect(c.destination);
    const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=b;
    const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=650;f.Q.value=0.5;
    const g=c.createGain();g.gain.value=0.05;s.connect(f);f.connect(g);g.connect(this.master);s.start();this.crowd=g;},
  setOn(on){if(this.master)this.master.gain.value=on?0.8:0;},
  tone(type,f0,f1,dur,vol,delay=0){if(!this.ctx)return;const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.05);},

  losLine.position.z=L;fdLine.position.z=G.fdz;fdLine.visible=G.fdz<100;
  setPlay(G.playIdx);
}
function routePts(p,name){const sd=Math.sign(p.pos.x)||1;const out=sd,inn=-sd;const pts=[];
  for(const w of ROUTES[name]){let x,z;if(w[0]==='o'){x=p.pos.x+out*w[1];z=p.pos.z+w[2];}else if(w[0]==='i'){x=p.pos.x+inn*w[1];z=p.pos.z+w[2];}else{x=p.pos.x+w[0];z=p.pos.z+w[1];}
    pts.push(V(clamp(x,-HALF+1,HALF-1),0,Math.min(z,109)));}return pts;}
function setPlay(i){
  const names=G.lvl.plays||PLAYNAMES;G.playIdx=clamp(i,0,names.length-1);const play=PLAYS[names[G.playIdx]];
  routeGroup.clear();
  for(const p of G.elig){if(p.labelSprite){scene.remove(p.labelSprite);p.labelSprite=null;}const key=p.role;p.routeName=play[key];p.route=routePts(p,p.routeName);p.wp=0;
    const pts=[V(p.pos.x,0.06,p.pos.z),...p.route.map(q=>V(q.x,0.06,q.z))];
    const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',0.05);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.11,5,false),new THREE.MeshBasicMaterial({color:p.color,transparent:true,opacity:0.9,depthWrite:false}));routeGroup.add(tube);
    const end=pts[pts.length-1],prev=pts[pts.length-2];const cone=new THREE.Mesh(new THREE.ConeGeometry(0.45,0.9,10),new THREE.MeshBasicMaterial({color:p.color}));
    cone.position.copy(end);const d=end.clone().sub(prev).normalize();cone.quaternion.setFromUnitVectors(V(0,1,0),d);routeGroup.add(cone);
    const lab=labelSprite(p.label,p.color);lab.position.set(p.pos.x,2.7,p.pos.z);scene.add(lab);p.labelSprite=lab;}
  renderPlayCards();
}
function place(p){p.mesh.g.position.set(p.pos.x,0,p.pos.z);p.mesh.g.rotation.y=p.face;}

/* ---------------- level flow ---------------- */

function hikeBall(){if(G.phase!=='presnap')return;A.init();A.hut();buzz(10);hideBanner();
  G.phase='pocket';G.pressT=0;G.plays++;

/* ---------------- simulation ---------------- */
function steer(p,target,speed,dt){const dx=target.x-p.pos.x,dz=target.z-p.pos.z,d=Math.hypot(dx,dz);
  let tx=0,tz=0;if(d>0.05){const s=Math.min(speed,d*4);tx=dx/d*s;tz=dz/d*s;}
  const ax=tx-p.vel.x,az=tz-p.vel.z,al=Math.hypot(ax,az),mx=p.acc*dt;if(al>mx){p.vel.x+=ax/al*mx;p.vel.z+=az/al*mx;}else{p.vel.x=tx;p.vel.z=tz;}}
function integrate(p,dt){p.pos.x+=p.vel.x*dt;p.pos.z+=p.vel.z*dt;p.hist.push({t:G.t,x:p.pos.x,z:p.pos.z});if(p.hist.length>90)p.hist.shift();
  const sp=Math.hypot(p.vel.x,p.vel.z);if(sp>0.6){const want=Math.atan2(p.vel.x,p.vel.z);let d=want-p.face;d=Math.atan2(Math.sin(d),Math.cos(d));p.face+=d*Math.min(1,dt*10);}}
function past(p,lag){const tt=G.t-lag;for(let i=p.hist.length-1;i>=0;i--)if(p.hist[i].t<=tt)return p.hist[i];return p.hist[0]||{x:p.pos.x,z:p.pos.z};}
function routeTarget(p){if(p.wp<p.route.length){const q=p.route[p.wp];if(hd(p.pos,q)<0.7)p.wp++;}
  if(p.wp<p.route.length)return p.route[p.wp];
  if(STOPS.includes(p.routeName))return V(p.pos.x,0,p.pos.z-0.3);
  const a=p.route[p.route.length-2]||p.pos,b=p.route[p.route.length-1];const d=V(b.x-a.x,0,b.z-a.z).normalize();return V(p.pos.x+d.x*6,0,Math.min(109,p.pos.z+d.z*6));}

function simPocket(dt){
  const qb=G.qb;const L=G.los;
  // QB drop
  if(!G.sacked){steer(qb,V(qb.pos.x,0,L-8.5),5,dt);}
  // line play
  const ol=G.off.filter(p=>p.role==='OL'),dl=G.def.filter(p=>p.role==='DL');
  G.pressT+=dt;const pr=G.pressT/G.pressMax;
  dl.forEach((d,i)=>{const o=ol[Math.min(ol.length-1,Math.round(i*1.3))];
    if(d.free){steer(d,qb.pos,7,dt);}
    else{const push=Math.min(2.6,pr*2.6);steer(d,V(d.pos.x*0.95,0,L+0.3-push),2,dt);if(o)steer(o,V(o.pos.x,0,d.pos.z-0.9),3,dt);d.phase+=dt*4;}});
  if(pr>=1&&!dl.some(d=>d.free)){const d=dl.reduce((a,b)=>Math.abs(a.pos.x)<Math.abs(b.pos.x)?a:b);d.free=true;d.crouch=0;}
  // receivers
  for(const p of G.elig){steer(p,routeTarget(p),p.max,dt);}
  // coverage
  for(const d of G.def){
    if(d.role==='DL'||d.stun>0)continue;
    if(d.blitz){steer(d,qb.pos,G.pressT>0.4?7:3,dt);continue;}
    if(d.man){const h=past(d.man,d.lag);const c=lerp(d.cush,-1.6*(1-G.lvl.s),clamp(G.pressT/1.6,0,1));steer(d,V(h.x+(d.man.pos.x>0?-0.5:0.5),0,h.z+c),d.max,dt);}
    else if(d.zone){const side=G.elig.filter(r=>Math.sign(r.pos.x||1)===d.zone);const deep=side.reduce((a,b)=>b.pos.z>a.pos.z?b:a,side[0]||G.elig[0]);
      steer(d,V(lerp(d.zone*9,deep.pos.x,0.6),0,Math.max(L+12,deep.pos.z+4)),d.max,dt);}
    else steer(d,V(qb.pos.x*0.5,0,L+5),5,dt);
  }
  // sack
  for(const d of G.def){if((d.free||d.blitz)&&hd(d.pos,qb.pos)<0.9&&G.phase==='pocket'){sack(d);return;}}
}
function simAir(dt){
  const b=G.ball;b.t+=dt;
  const tgt=G.target;
  for(const p of G.elig){if(p===tgt){const rem=Math.max(0.05,b.T-b.t);const d=hd(p.pos,b.to);steer(p,b.to,Math.min(p.max*1.25,d/rem+1),dt);}else steer(p,routeTarget(p),p.max,dt);}
  for(const d of G.def){if(d.role==='DL'){if(d.free)steer(d,G.qb.pos,6,dt);continue;}
    const covering=(d.man&&d.man===tgt)||(d.zone&&hd(d.pos,b.to)<14)||(!d.man&&!d.zone&&hd(d.pos,b.to)<9);
    if(covering&&b.t>d.lag*0.8){steer(d,b.to,d.max*0.97,dt);}
    else if(d.man){const h=past(d.man,d.lag);steer(d,V(h.x,0,h.z-1.6*(1-G.lvl.s)),d.max,dt);}else steer(d,b.to,d.max*0.6,dt);}
  steer(G.qb,G.qb.pos,3,dt);
  // star collected by the ball in flight
  if(G.star&&ballPos(b.t/b.T).distanceTo(G.star)<1.4)grabStar();
  if(b.t>=b.T)resolveCatch();
}
function ballPos(f){const b=G.ball;const p=b.from.clone().lerp(b.to,f);p.y=lerp(b.from.y,b.to.y,f)+b.apex*4*f*(1-f);return p;}
function resolveCatch(){
  const b=G.ball,land=b.to;
  let rec=null,rd=1e9;for(const p of G.elig){const d=hd(p.pos,land);if(d<rd){rd=d;rec=p;}}
  let df=null,dd=1e9;for(const p of G.def){if(p.role==='DL')continue;const d=hd(p.pos,land);if(d<dd){dd=d;df=p;}}
  const inb=Math.abs(land.x)<HALF&&land.z<110;
  if(rec&&rd<1.7&&inb){
    if(df&&dd<0.9&&dd<rd-0.3){if(Math.random()<0.2+G.lvl.s*0.15)return intercept(df);return incomplete('BROKEN UP!');}
    if(df&&dd<0.9&&Math.random()<0.25)return incomplete('BROKEN UP!');
    return caught(rec,df&&dd<1.6);
  }
  if(df&&dd<1.1&&inb&&Math.random()<0.3+G.lvl.s*0.2)return intercept(df);
  incomplete(inb?'INCOMPLETE':'OUT OF BOUNDS');
}
function caught(p,contested){
  G.phase='run';G.runner=p;G.ball.state='held';G.ball.holder=p;routeGroup.visible=false;
  A.catch();buzz(15);emit(V(p.pos.x,1.5,p.pos.z),18,'#ffffff',4,0.6);
  if(p.pos.z>=100){touchdown(true);return;}
  say(contested?'WHAT A CATCH!':'CAUGHT!',contested?'':'cool','');G.shake=contested?0.5:0.25;
  // offensive players become blockers
  for(const o of G.off){if(o!==p&&o!==G.qb)o.block=true;}
  aimDots.visible=aimRing.visible=lockRing.visible=false;qbRing.visible=false;
}
function simRun(dt){
  const r=G.runner;if(!r)return;
  const fwd=r.max*(G.juke>0?1.3:1.0);
  let vx=0;if(G.steer){vx=clamp((G.steer.x-G.steer.x0)/(W*0.2),-1,1)*7.5*G.steerSign;}
  const tgt=V(r.pos.x+vx*0.5,0,r.pos.z+fwd*0.5);steer(r,tgt,Math.hypot(vx,fwd),dt);
  if(G.juke>0)G.juke-=dt;if(G.jukeCd>0)G.jukeCd-=dt;
  // blockers
  for(const o of G.off){if(!o.block)continue;if(o.engaged){o.engT-=dt;if(o.engT<=0||o.engaged.stun<=0){o.engaged=null;}else{steer(o,o.engaged.pos,3,dt);continue;}}
    let best=null,bd=12;for(const d of G.def){if(d.stun>0)continue;const dd=hd(o.pos,d.pos);const toR=hd(d.pos,r.pos);if(dd<bd&&toR<16){bd=dd;best=d;}}
    if(best){steer(o,best.pos,o.max,dt);if(bd<1.0){o.engaged=best;o.engT=1.4;best.stun=1.4;}}else steer(o,V(r.pos.x,0,r.pos.z+3),o.max*0.8,dt);}
  // pursuit
  for(const d of G.def){if(d.stun>0){d.stun-=dt;d.vel.multiplyScalar(0.85);continue;}
    const dist=hd(d.pos,r.pos);const lead=Math.min(1.2,dist/d.max*0.7);const aim=V(r.pos.x+r.vel.x*lead,0,r.pos.z+r.vel.z*lead);
    steer(d,aim,d.max*(1+G.lvl.s*0.06),dt);
    if(dist<0.85){if(G.juke>0&&!d.juked){d.juked=true;d.stun=1.1;say('BROKE IT!','cool','');A.juke();G.shake=0.3;emit(V(d.pos.x,1,d.pos.z),12,'#ffffff',4,0.5);}else if(!d.juked||d.stun<=0){tackle(d);return;}}}
  if(G.star&&hd(r.pos,G.star)<1.5)grabStar();
  if(Math.abs(r.pos.x)>HALF){deadBall('OUT OF BOUNDS',r.pos.z,false);return;}
  if(r.pos.z>=100){touchdown();return;}
}
function simDead(dt){for(const p of G.players){if(p.fall>0)continue;p.vel.multiplyScalar(Math.exp(-3*dt));}}

/* ---------------- outcomes ---------------- */
function sack(d){G.sacked=true;const qb=G.qb;A.tackle();buzz(30);G.hitstop=0.1;G.shake=0.7;qb.fall=0.001;qb.fallDir=Math.sign(qb.pos.z-d.pos.z)||-1;
  emit(V(qb.pos.x,1,qb.pos.z),20,'#ffffff',5,0.6);deadBall('SACKED!',qb.pos.z,true);}
function tackle(d){const r=G.runner;A.tackle();buzz(30);G.hitstop=0.09;G.shake=0.7;r.fall=0.001;r.fallDir=1;d.fall=0.001;d.fallDir=1;
  emit(V(r.pos.x,1,r.pos.z),24,'#ffffff',5,0.6);deadBall('TACKLED',r.pos.z,false);}
function incomplete(txt){G.ball.state='loose';G.phase='dead';G.ball.vel=V(rnd(-2,2),2,2);A.ooh();say(txt,'bad','');
  after(1.6,()=>nextDown(G.los,false));}
function intercept(d){G.phase='dead';G.picked=d;G.ball.state='held';G.ball.holder=d;A.ooh();A.swell(0.1,3);G.shake=0.4;say('PICKED OFF!','bad','');
  after(1.9,()=>levelFail('Intercepted'));}
function deadBall(txt,z,bad){G.phase='dead';const gain=Math.round(z-G.los);
  const yd=gain===0?'No gain':gain>0?`+${gain} yards`:`${gain} yards`;
  const fd=z>=G.fdz&&G.fdz<100;
  say(fd?'FIRST DOWN!':txt,bad?'bad':fd?'cool':'',yd);if(fd){A.swell(0.12,3);emit(V(0,2,G.fdz),30,'#ffe14d',6,0.8);}
  after(1.8,()=>nextDown(z,fd));}
function nextDown(z,fd){if(G.mode!=='career')return;
  G.los=clamp(Math.round(z),1,99);if(fd){G.down=1;G.fdz=Math.min(100,G.los+10);}else{G.down++;}
  if(G.down>G.maxDowns){levelFail(G.maxDowns===1?'Out of time':'Turnover on downs');return;}
  if(G.los>=G.fdz){G.down=1;G.fdz=Math.min(100,G.los+10);}
  G.sacked=false;newPlay(false);}
function touchdown(inAir){
  G.phase='td';G.tdT=0;routeGroup.visible=false;$('#pressure').classList.add('hidden');G.timeScale=0.3;const r=G.runner;A.td();buzz(40);G.flash=1;G.shake=1;r.cel=0.001;
  updBoard('TOUCHDOWN!');
  bigLetters('TOUCHDOWN!','',`${myTeam().name.toUpperCase()} · ${G.plays} play${G.plays>1?'s':''}`);
  for(let i=0;i<9;i++)after(0.3+i*0.35,firework);confettiBurst();
  emit(V(r.pos.x,1.5,r.pos.z),60,'#ffd23f',9,1.2);ringScreen(W/2,H*0.4,'255,230,120',320);
  after(3.6,levelWin);}
function grabStar(){if(!G.star)return;const p=G.star.clone();G.star=null;G.starEver=true;starMesh.visible=starGlow.visible=false;
  A.star();buzz(15);emit(p,50,'#ffd23f',7,1);G.hitstop=Math.max(G.hitstop,0.05);
  const sp=p.clone().project(camera);flyStar((sp.x+1)/2*W,(1-sp.y)/2*H);updateHud();}

/* ---------------- level end ---------------- */
function levelWin(){if(G.mode!=='career')return;const i=G.li;const mask=1|(G.starEver?2:0)|(G.plays===1?4:0);
  const old=S.stars[i]||0,nw=old|mask;const pc=n=>(n&1)+((n>>1)&1)+((n>>2)&1);const coins=15+(pc(nw)-pc(old))*20;S.stars[i]=nw;save();addCoins(coins);
  $('#rTitle').textContent='TOUCHDOWN!';$('#rSub').textContent=`${G.lvl.t} · ${G.plays} play${G.plays>1?'s':''}`;
  $('#rStars').innerHTML=[1,2,4].map((b,j)=>`<span class="${mask&b?'on':''}" style="animation-delay:${0.15+j*0.2}s">★</span>`).join('');

  $('#rList').innerHTML=[['Score a touchdown',1],['Grab the star',mask&2],['Score on the first play',mask&4]].map(r=>`<div class="${r[1]?'ok':'no'}"><span>${r[0]}</span><span>${r[1]?'✔':'✖'}</span></div>`).join('');

function rollCoins(n){const el=$('#rCoins');let c=0,i=0;el.innerHTML='<span class="coin"></span>+0';const st=Math.max(1,Math.ceil(n/24));
  const iv=setInterval(()=>{c=Math.min(n,c+st);el.innerHTML=`<span class="coin"></span>+${c}`;A.tick(i++%12);if(c>=n){clearInterval(iv);A.coin();}},45);}

function startFG(){hideAll();G.mode='fg';G.opp=pick(TEAMS.filter(t=>t.id!==S.team));setFieldLook(myTeam(),G.opp);setCrowd();G.fgDist=22;G.fgStreak=0;G.lvl={s:0.3};nextFG(true);
  showBanner('Field Goal Frenzy','Touch where you want to aim between the posts and let go to kick. Watch the wind!','Every make moves you back 5 yards',3.5);A.whistle();}
function nextFG(first){G.timers=[];G.phase='fgaim';G.result=null;clearPlayers();routeGroup.clear();G.star=null;starMesh.visible=starGlow.visible=false;
  const z=110-G.fgDist;G.fgSpot=V(rnd(-4,4)*Math.min(1,G.fgStreak/3),0,z);
  G.wind=G.fgStreak===0?0:rnd(-1,1)*Math.min(14,3+G.fgStreak*2);
  const k=addP('O','K',G.fgSpot.x-1.2,z-2.6,{num:S.number});k.face=0.35;G.kicker=k;const h=addP('O','H',G.fgSpot.x+0.6,z,{});h.crouch=1;
  for(const x of[-2.8,-1.4,0,1.4,2.8])addP('O','OL',G.fgSpot.x+x,z+6.2,{big:true}).crouch=1;
  for(const x of[-3,-1,1,3])addP('D','DL',G.fgSpot.x+x,z+7.4,{big:true}).crouch=1;
  G.players.forEach(place);G.ball.state='fgset';ball.position.set(G.fgSpot.x,0.25,z);ballSpin.rotation.set(0,0,0);ball.rotation.set(Math.PI/2,0,0);
  losLine.position.z=z+7;fdLine.visible=false;

  updateHud();showPlayUI();}
function kickFG(aimPt){A.init();G.phase='fgair';const k=G.kicker;k.kickT=0.001;A.kick();buzz(15);
  const from=V(G.fgSpot.x,0.25,G.fgSpot.z);const dist=110-from.z;const T=clamp(dist/26,0.9,2.3);
  G.ball.state='fg';G.ball.from=from;G.ball.to=V(aimPt.x,aimPt.y,110);G.ball.t=0;G.ball.T=T;G.ball.apex=Math.max(2,dist*0.17);
  aimDots.visible=aimRing.visible=false;}
function simFG(dt){const b=G.ball;b.t+=dt;const f=b.t/b.T;const p=ballPos(f);p.x+=G.wind*0.045*b.t*b.t;ball.position.copy(p);ballSpin.rotation.x+=dt*14;
  if(f>=1&&G.phase==='fgair'){G.phase='fgdone';const good=Math.abs(p.x)<3.08-0.1&&p.y>3.33;const post=!good&&Math.abs(Math.abs(p.x)-3.08)<0.25&&p.y>3.2;
    if(good){G.fgStreak++;A.td();G.flash=0.8;G.shake=0.6;confettiBurst();for(let i=0;i<3;i++)after(0.2+i*0.35,firework);bigLetters("IT'S GOOD!",'',`${G.fgDist} yards`);
      S.best.fg=Math.max(S.best.fg,G.fgDist);save();addCoins(5+Math.round(G.fgDist/5));G.fgDist=Math.min(65,G.fgDist+5);after(2.6,()=>nextFG(false));}

  for(const r of FX.rings){r.t+=dt;const f=r.t/r.life,e=1-Math.pow(1-f,3);fx.strokeStyle=`rgba(${r.col},${1-f})`;fx.lineWidth=2+8*(1-f);fx.beginPath();fx.arc(r.x,r.y,lerp(10,r.r1,e),0,7);fx.stroke();}
  FX.rings=FX.rings.filter(r=>r.t<r.life);fx.globalCompositeOperation='source-over';
  for(const c of FX.conf){c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;c.vx+=Math.sin(c.t*3+c.w)*20*dt;fx.save();fx.translate(c.x,c.y);fx.rotate(c.r);fx.fillStyle=c.c;fx.fillRect(-c.w/2,-c.w/4,c.w,c.w/2*Math.abs(Math.cos(c.t*6+c.w)));fx.restore();}
  FX.conf=FX.conf.filter(c=>c.y<H+20);
  for(const f of FX.flyers){f.t+=dt/0.7;const t=Math.min(1,f.t),e=t*t*(3-2*t);const x=lerp(f.x0,f.x1,e),y=lerp(f.y0,f.y1,e)-Math.sin(t*Math.PI)*80;
    fx.save();fx.translate(x,y);fx.rotate(t*6);fx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=(i%2?0.45:1)*lerp(26,11,t);fx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
    fx.fillStyle='#ffd23f';fx.shadowColor='#ffd23f';fx.shadowBlur=20;fx.fill();fx.restore();}
  if(FX.flyers.some(f=>f.t>=1)){const el=document.querySelectorAll('#hStars .hstar')[1];if(el){el.animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:450,easing:'cubic-bezier(.2,1.8,.4,1)'});}}
  FX.flyers=FX.flyers.filter(f=>f.t<1);
  if(fpView()&&(G.phase==='presnap'||G.phase==='pocket')){for(const p of G.elig){const v=V(p.pos.x,2.7,p.pos.z).project(camera);
      const behind=v.z>1;let x=(v.x+1)/2*W,y=(1-v.y)/2*H;if(!behind&&x>14&&x<W-14&&y>70&&y<H-14)continue;
      if(behind){x=W-x;y=H-y;}const cx_=W/2,cy_=H/2;let dx=x-cx_,dy=y-cy_;const k=Math.min((W/2-28)/Math.abs(dx||1e-6),(H/2-90)/Math.abs(dy||1e-6));
      const ax=cx_+dx*k,ay=cy_+dy*k;const ang=Math.atan2(dy,dx);
      fx.save();fx.translate(ax,ay);fx.fillStyle=p.openCol||p.color;fx.beginPath();fx.arc(0,0,15,0,7);fx.fill();fx.lineWidth=3;fx.strokeStyle='#0b1530';fx.stroke();
      fx.fillStyle='#0b1530';fx.font='17px "Lilita One",Arial';fx.textAlign='center';fx.textBaseline='middle';fx.fillText(p.label,0,1);
      fx.rotate(ang);fx.fillStyle=p.openCol||p.color;fx.beginPath();fx.moveTo(27,0);fx.lineTo(17,-7);fx.lineTo(17,7);fx.fill();fx.restore();}}
}

{const g=new THREE.Group();const frame=new THREE.Mesh(new THREE.BoxGeometry(44,21,1.5),new THREE.MeshLambertMaterial({color:0x0b0f1c}));g.add(frame);
