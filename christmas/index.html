<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Christmas Broadside</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: a nautical plotting chart. One working column, a header strip, the game board in the middle, fleet status along the bottom. */
:root{
  --bg:#e6ecee; --paper:#f7f9f8; --ink:#13263a; --muted:#56687a; --line:#c2cfd6;
  --sea:#cfe1e8; --sea-2:#bcd5df; --accent:#1f6b45; --accent-ink:#ffffff;
  --hit:#cf3e2a; --miss:#7f95a3; --ok:#23804f; --warn:#b5740a;
  --f1:#c8372d; --f2:#2763b8; --f3:#c98f00; --f4:#2e8b57;
  --display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --sea-hi:#79b3cd; --sea-lo:#2f6f8f; --wave:rgba(255,255,255,.10); --gridline:rgba(255,255,255,.24);
  --snow:#ffffff; --frame:#13263a; --frame-2:#b8963f; --hull:#5f6e7b; --hull-2:#39454f; --deck:#94a2ad; --aim-bg:rgba(255,255,255,.2); --splash:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1620; --paper:#13212e; --ink:#e2ebef; --muted:#93a5b2; --line:#2a3c4b;
  --sea:#16324a; --sea-2:#1c3c57; --accent:#62c491; --accent-ink:#06121c;
  --hit:#ff6a50; --miss:#6b8293; --ok:#4cc488; --warn:#e6a93a;
  --f1:#ec5a4e; --f2:#5a93e6; --f3:#e8b52e; --f4:#4cbf82; --sea-hi:#1d5577; --sea-lo:#0a2539; --wave:rgba(255,255,255,.05); --gridline:rgba(255,255,255,.13);
  --snow:#dfeaf2; --frame:#33495c; --frame-2:#8a7444; --hull:#8d9ca8; --hull-2:#5c6b77; --deck:#b9c5cd; --aim-bg:rgba(255,255,255,.13); --splash:#e2f4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1620; --paper:#13212e; --ink:#e2ebef; --muted:#93a5b2; --line:#2a3c4b;
  --sea:#16324a; --sea-2:#1c3c57; --accent:#62c491; --accent-ink:#06121c;
  --hit:#ff6a50; --miss:#6b8293; --ok:#4cc488; --warn:#e6a93a;
  --f1:#ec5a4e; --f2:#5a93e6; --f3:#e8b52e; --f4:#4cbf82; --sea-hi:#1d5577; --sea-lo:#0a2539; --wave:rgba(255,255,255,.05); --gridline:rgba(255,255,255,.13);
  --snow:#dfeaf2; --frame:#33495c; --frame-2:#8a7444; --hull:#8d9ca8; --hull-2:#5c6b77; --deck:#b9c5cd; --aim-bg:rgba(255,255,255,.13); --splash:#e2f4ff; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.82;z-index:-1}
#app{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
#app.playing{max-width:1500px;min-height:100vh;padding-block:12px 20px}
@supports (min-height:100dvh){#app.playing{min-height:100dvh}}
.stage{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center;min-width:0}
:fullscreen body,:fullscreen{background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--hit);border-color:var(--hit)}
.btn.small{padding:6px 10px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:220px;font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--bg);font-size:14px}
.err{color:var(--hit);font-weight:600;font-size:14px}

/* masthead */
.mast{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.brand{font-family:var(--display);font-size:clamp(48px,11vw,96px);line-height:.9;letter-spacing:.01em;color:var(--ink)}
.brand span{color:var(--hit)}
.tagline{font-size:18px;max-width:56ch;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.home-grid{grid-template-columns:1fr}}
.rules{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.rules li::marker{font-family:var(--mono);color:var(--accent)}
.code-input{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em;font-size:20px;max-width:9.5em}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.topbar .mini{font-family:var(--display);font-size:28px;line-height:1}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:4px 8px;white-space:nowrap}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.2em}
.timer{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.timer .bar{width:120px;height:8px;background:var(--sea);border-radius:4px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.timer.low .bar i{background:var(--hit)}.timer.low{color:var(--hit)}

/* question */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.qtext{font-size:clamp(22px,3.2vw,44px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.ch{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:6px;padding:16px;min-height:clamp(76px,13vh,150px);font-size:clamp(18px,1.9vw,27px);font-weight:600;color:#fff;overflow-wrap:anywhere;transition:transform .1s,opacity .2s}
@media (hover:hover){.ch:not(:disabled):hover{transform:translateY(-2px)}}
.ch .k{font-family:var(--mono);font-size:15px;width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:3px;background:rgba(255,255,255,.22)}
.ch0{background:#b8352b}.ch1{background:#2559a8}.ch2{background:#c08a05;color:#1a1300}.ch3{background:#2a7d4f}
.ch2 .k{background:rgba(0,0,0,.12)}
.ch:disabled{cursor:default}
.ch.dim{opacity:.35}
.ch.picked{outline:4px solid var(--ink);outline-offset:2px}
.ch.right{opacity:1;box-shadow:0 0 0 4px var(--ok)}
.banner{border-radius:6px;padding:14px 18px;font-weight:600;font-size:18px;border:2px solid var(--line);background:var(--paper)}
.banner.good{border-color:var(--ok)}.banner.bad{border-color:var(--hit)}

.lvl{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1.5px solid currentColor}
.lvl.easy{color:var(--ok)}.lvl.medium{color:var(--warn)}.lvl.hard{color:var(--hit)}
/* boards */
.board-wrap{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:flex-start}
.board-title{display:flex;align-items:center;gap:8px;font-weight:700}
.bd{--cell:36px;display:grid;grid-template-columns:calc(var(--cell)*.55) auto;grid-template-rows:calc(var(--cell)*.55) auto;width:max-content;max-width:100%;padding:0 calc(var(--cell)*.16) calc(var(--cell)*.16) 0}
.bd.lg{--cell:clamp(34px,min(calc((100vh - 200px)/8.8),calc((100vw - 64px)/8.8)),92px)}
.bd.md{--cell:clamp(28px,min(calc((100vh - 300px)/8.8),calc((100vw - 140px)/17.6)),66px)}
.bd.sm{--cell:clamp(18px,2.3vw,30px)}
@supports (height:100dvh){
  .bd.lg{--cell:clamp(34px,min(calc((100dvh - 200px)/8.8),calc((100vw - 64px)/8.8)),92px)}
  .bd.md{--cell:clamp(28px,min(calc((100dvh - 300px)/8.8),calc((100vw - 140px)/17.6)),66px)}}
.bd.md3{--cell:clamp(24px,min(calc((100vh - 300px)/8.8),calc((100vw - 170px)/26.4)),60px)}
@supports (height:100dvh){.bd.md3{--cell:clamp(24px,min(calc((100dvh - 300px)/8.8),calc((100vw - 170px)/26.4)),60px)}}
@media (max-width:700px){.bd.md,.bd.md3{--cell:clamp(26px,calc((100vw - 64px)/8.8),50px)}}
.bd-cols,.bd-rows{display:grid;font-family:var(--mono);font-weight:600;font-size:max(10px,calc(var(--cell)*.3));color:var(--muted)}
.bd-cols{grid-column:2;grid-row:1;grid-template-columns:repeat(8,var(--cell))}
.bd-rows{grid-column:1;grid-row:2;grid-template-rows:repeat(8,var(--cell))}
.bd-cols span,.bd-rows span{display:grid;place-items:center}
.sea{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));position:relative;border-radius:calc(var(--cell)*.14);overflow:hidden;isolation:isolate;
  background:radial-gradient(130% 100% at 25% 15%,var(--sea-hi),var(--sea-lo));
  box-shadow:0 0 0 2px var(--frame),0 0 0 calc(2px + var(--cell)*.09) var(--frame-2),0 0 0 calc(3px + var(--cell)*.09) var(--frame),0 14px 34px -14px rgba(0,0,0,.55)}
.sea::before{content:"";position:absolute;inset:-60%;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,transparent 0 calc(var(--cell)*.42),var(--wave) calc(var(--cell)*.42) calc(var(--cell)*.5));animation:drift 16s linear infinite}
@keyframes drift{to{transform:translate(calc(var(--cell)*1.06),calc(var(--cell)*.5))}}
.cl{position:relative;z-index:1;border:0;padding:0;margin:0;background:transparent;box-shadow:inset 0 0 0 .5px var(--gridline);border-radius:0;min-width:0}
button.cl{cursor:pointer}
button.cl:disabled{cursor:default}
.bd.aim{cursor:crosshair}
.bd.aim button.cl:not(:disabled):hover,.bd.place button.cl:hover{background:var(--aim-bg)}
.bd.aim button.cl:not(:disabled):hover::after{content:"";position:absolute;inset:16%;border:2px solid var(--splash);border-radius:50%;
  background:linear-gradient(var(--splash),var(--splash)) center/2px 70% no-repeat,linear-gradient(var(--splash),var(--splash)) center/70% 2px no-repeat}
.bd.aim button.cl:focus-visible{outline:3px solid var(--splash);outline-offset:-3px}
.ship{pointer-events:none;z-index:2;position:relative;padding:calc(var(--cell)*.05);filter:drop-shadow(0 calc(var(--cell)*.06) calc(var(--cell)*.05) rgba(0,0,0,.4))}
.shipsvg{width:100%;height:100%;display:block}
.shipsvg .hl{fill:var(--hull)}.shipsvg .dk{fill:var(--deck)}.shipsvg .br,.shipsvg .tu{fill:var(--hull-2)}
.shipsvg .wake{fill:none;stroke:var(--splash);stroke-width:4;opacity:.35}
.ship.sel .hl{fill:var(--accent)}
.ship.sel{filter:drop-shadow(0 0 calc(var(--cell)*.12) var(--accent))}
.ship.sunk{filter:drop-shadow(0 0 calc(var(--cell)*.08) rgba(0,0,0,.6))}
.ship.sunk .hl{fill:#8e2a1a;stroke:#ffd6c9;stroke-width:5}.ship.sunk .dk{fill:#c4563e}.ship.sunk .br,.ship.sunk .tu{fill:#5a160c}
.mk.wreck{background:none}.mk.wreck svg{width:46%;height:46%}.mk.wreck .burst{animation:none}
.sunklist{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sunklist .tag{color:var(--hit);border-color:var(--hit)}
.shipcount{display:flex;gap:4px;align-items:center}
.shipcount i{display:block;height:7px;border-radius:2px;background:var(--ok)}
.shipcount i.x{background:var(--hit);opacity:.45}
.ship.sunk .wake{display:none}
.mk{pointer-events:none;z-index:3;position:relative;display:grid;place-items:center;color:var(--splash)}
.mk svg{width:86%;height:86%;overflow:visible}
.mk.hit{color:#ff9a3c;background:radial-gradient(circle,rgba(255,110,30,.55),transparent 68%)}
.mk.hit .burst{transform-origin:0 0;animation:flicker 1.8s ease-in-out infinite}
@keyframes flicker{50%{transform:scale(.88) rotate(10deg)}}
.mk .b1{fill:#e8461f}.mk .b2{fill:#ffb02e}.mk .b3{fill:#fff3c4}
.mk .sp{fill:none;stroke:var(--splash)}.mk .sp0{fill:var(--splash);stroke:none;opacity:.95}
.mk.pend svg{animation:spin 1.4s linear infinite}
.mk .ret{fill:none;stroke:var(--splash);stroke-width:5;stroke-dasharray:14 10}
.mk.fresh svg{animation:boom .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d,0ms)}
.mk.fresh::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid currentColor;animation:ring .9s ease-out both;animation-delay:var(--d,0ms)}
@keyframes boom{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.bd.shake .sea{animation:shake .45s ease-out both;animation-delay:var(--d,0ms)}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
@media (prefers-reduced-motion:reduce){.sea::before,.mk *,.mk svg,.bd.shake .sea{animation:none!important}.mk.fresh::before{display:none}.ch{transition:none}}
.boards{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.qlayout{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
@media (max-width:900px){.qlayout{grid-template-columns:1fr}}
.minifleet{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* ships picker */
.shipbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 12px;min-height:44px;font-weight:600;text-align:left}
.shipbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pips{display:flex;gap:3px}.pips i{width:12px;height:12px;background:var(--muted);border-radius:2px}
.shipbtn.on .pips i{background:var(--accent)}

/* fleet strip */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fcard{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard.dead{opacity:.6}
.fname{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.fname b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{width:16px;height:12px;flex:none;border-radius:1px}
.hull{display:flex;gap:2px}.hull i{flex:1;height:8px;background:var(--ok);border-radius:1px}.hull i.x{background:var(--hit);opacity:.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--hit);border-color:var(--hit)}.tag.acc{color:var(--accent);border-color:var(--accent)}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list>li,.list>div{list-style:none;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
ul.list{margin:0;padding:0}
.setpick{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.setpick input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.preview{display:flex;flex-direction:column;gap:8px;font-size:14px}
.preview .pq{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--bg)}
.preview .pq b{display:block}
.report{display:flex;flex-direction:column;gap:6px;margin:0;padding:0}
.report li{list-style:none;display:flex;gap:10px;align-items:center;font-size:15px}
.big-num{font-family:var(--display);font-size:44px;line-height:1}
.rank{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.rank .pos{font-family:var(--display);font-size:34px;width:40px;text-align:center}
.rank .who{flex:1;min-width:0;display:flex;flex-direction:column}
.sub{font-size:14px;color:var(--muted)}

/* snowfall + phone layout */
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(circle,var(--snow) 1.4px,transparent 2px),radial-gradient(circle,var(--snow) 1px,transparent 1.6px);
  background-size:90px 90px,55px 55px;background-position:0 0,20px 35px;animation:snowfall 22s linear infinite}
@keyframes snowfall{to{background-position:30px 900px,60px 935px}}
#app{position:relative;z-index:1}
button,.cl{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){.snow{animation:none}}
@media (max-width:600px){
  #app{gap:12px}
  #app.playing{padding-block:8px 16px}
  .topbar{gap:8px;padding-bottom:8px}
  .topbar .mini{display:none}
  .timer{font-size:16px}.timer .bar{width:64px}
  .chip{font-size:12px;padding:3px 6px}
  .panel{padding:14px;gap:12px}
  .qcard{padding:14px 14px 16px}
  .qtext{font-size:21px}
  .choices{gap:8px}
  .ch{min-height:58px;font-size:17px;padding:10px 12px}
  .ch .k{width:28px;height:28px}
  .minifleet{display:none}
  .fleet{grid-template-columns:1fr 1fr;gap:8px}
  .fcard{padding:8px}
  .boards{gap:18px}
  .bd.lg,.bd.md,.bd.md3{--cell:clamp(28px,calc((100vw - 72px)/9),46px)}
  .brand{font-size:58px}
  .banner{font-size:16px;padding:12px 14px}
  .split{gap:16px}
  .stage h2{font-size:20px}
}
</style>

</head>
<body>
<div class="snow" aria-hidden="true"></div>
<div id="app"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script>
(() => {
"use strict";
const N = 8, SHIPS = [4, 3, 3, 2], SHIP_NAMES = ["Battleship", "Cruiser", "Submarine", "Destroyer"], COLS = "ABCDEFGH";
const TOTAL = SHIPS.reduce((a, b) => a + b, 0);
const FLAG_VARS = ["--f1", "--f2", "--f3", "--f4"];
const FLAG_NAMES = ["Red", "Blue", "Gold", "Green"];
const BOT_NAMES = ["Admiral Bot", "Captain Bot", "Ensign Bot"];

/* ---------- question parsing ---------- */
function parseSet(text, askBy) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const cards = [], qs = [], bad = [];
  lines.forEach((raw, i) => {
    const dm = raw.match(/^\[(easy|medium|hard)\]\s*/i);
    const d = dm ? dm[1].toLowerCase() : null;
    const line = dm ? raw.slice(dm[0].length) : raw;
    let parts = null;
    if (line.includes("\t")) parts = line.split("\t");
    else if (line.includes("|")) parts = line.split("|");
    else { const k = line.indexOf(" - "); if (k > 0) parts = [line.slice(0, k), line.slice(k + 3)]; }
    parts = parts ? parts.map(s => s.trim()).filter(Boolean) : [];
    if (parts.length === 2) cards.push({ term: parts[0], def: parts[1], d });
    else if (parts.length >= 3) qs.push({ q: parts[0], a: parts[1], w: parts.slice(2, 5), d });
    else bad.push(i + 1);
  });
  const prompt = c => askBy === "term" ? c.term : c.def;
  const answer = c => askBy === "term" ? c.def : c.term;
  const pool = [...new Set(cards.map(answer))];
  let lonely = 0;
  cards.forEach(c => {
    const a = answer(c);
    const w = shuffle(pool.filter(x => x !== a)).slice(0, 3);
    if (w.length) qs.push({ q: prompt(c), a, w, d: c.d }); else lonely++;
  });
  return { qs, bad, cards: cards.length, lonely };
}

/* ---------- fleet helpers ---------- */

}

    const used = new Set(), ships = [];
    for (const len of SHIPS) {
      for (let t = 0; t < 200; t++) {
        const cells = shipCells(rand(N * N), len, Math.random() < .5);
        if (cells.every(c => !used.has(c))) { cells.forEach(c => used.add(c)); ships.push(cells); break; }

  }
}

  shotSet.forEach(c => (shipSet.has(c) ? h : m).push(c));
  const hs = new Set(h);
  const s = ships.filter(sh => sh.every(c => hs.has(c)));
  const left = ships.flat().filter(c => !hs.has(c)).length;

    presence(patch) { const n = { ...pres }; for (const k in patch) { if (patch[k] === null) delete n[k]; else n[k] = patch[k]; } pres = n; queueMicrotask(onChange); return Promise.resolve(); },
    leave() {}

function peerOpen(peer) {

    peer.on("open", id => { clearTimeout(t); res(id); });

async function makeRoomNet(code, asHost) {

    const me = { peer: myId, isMe: true, sameTab: true, kind: "viewer", presence: mine };
    if (asHost) snapshot = [me, ...[...others].map(([id, pr]) => ({ peer: id, isMe: false, sameTab: false, kind: "viewer", presence: pr || {} }))];
    else snapshot = [me, ...snapshot.filter(p => !p.sameTab)];
  };

  const broadcast = () => {
    if (bq) return; bq = true;
    setTimeout(() => {
      bq = false;
      const all = [[myId, mine], ...others];
      conns.forEach(c => { try { if (c.open) c.send({ t: "all", all }); } catch {} });
    }, 30);
  };
  if (asHost) {
    peer = new Peer(roomId, { debug: 0 });
    myId = await peerOpen(peer);
    peer.on("connection", conn => {
      conn.on("open", () => { conns.set(conn.peer, conn); if (!others.has(conn.peer)) others.set(conn.peer, {}); rebuild(); broadcast(); onChange(); });

      conn.on("close", drop); conn.on("error", drop);
    });

    peer = new Peer(undefined, { debug: 0 });
    myId = await peerOpen(peer);
    hostConn = await new Promise((res, rej) => {
      const c = peer.connect(roomId, { reliable: true });
      const t = setTimeout(() => rej(new Error("No game found with that code. Check it with the host.")), 12000);
      c.on("open", () => { clearTimeout(t); res(c); });
      peer.on("error", e => { clearTimeout(t); rej(e && e.type === "peer-unavailable" ? new Error("No game found with that code. Check it with the host.") : e); });
    });

    local: false,
    peers: () => snapshot,
    presence(patch) {
      const n = { ...mine }; for (const k in patch) { if (patch[k] === null) delete n[k]; else n[k] = patch[k]; }
      mine = n; rebuild();

  };
}
async function waitForMe() {

}

}
function getG() {

  const hostPeer = net.peers().find(p => !p.sameTab && p.presence && p.presence.g && typeof p.presence.g === "object");

const mySeat = G => G && Array.isArray(G.seats) ? G.seats.findIndex(s => s.p === S.myPeer) : -1;
function seatPres(G, i) {

/* ---------- client loop ---------- */
function onChange() {
  if (!net) return scheduleRender();
  const G = getG();
  if (G) S.hadHost = true;
  if (G && G.seq !== S.seenSeq) { S.seenSeq = G.seq; S.seenAt = Date.now(); }
  const seat = mySeat(G);
  if (G && seat >= 0 && G.gid && G.gid !== ME.gid) {
    S.ships = randomFleet(); S.place = { sel: 0, horiz: true }; S.brdJs = "";
    setMe({ gid: G.gid, rdy: false, ans: null, shots: [], brd: null });
  }
  if (G && seat >= 0 && G.gid === ME.gid) {
    if (!["lobby", "place"].includes(G.ph) && !ME.rdy) {
      if (!S.ships.every(Boolean)) S.ships = randomFleet();
      setMe({ rdy: true });
    }
    if (ME.rdy) {
      const brd = boardFrom(S.ships, incoming(G, seat));
      const js = JSON.stringify(brd);
      if (js !== S.brdJs) { S.brdJs = js; setMe({ brd }); }
    }
  }
  scheduleRender();
}

/* ---------- host engine ---------- */
function buildG() {
  const showAns = ["reveal", "fire", "damage", "over"].includes(H.phase);
  const g = {
    v: 1, gid: H.gid, ph: H.phase, seq: H.seq, dur: H.dur, qi: H.qi, n: H.rounds || 0, title: H.title.slice(0, 80),
    q: H.q, ai: showAns ? H.ansIdx : null, seats: H.seats, ammo: H.ammo, tg: H.targets, sh: H.shooters,
    res: H.res, fast: H.fast, lone: !!H.lone, ba: H.ba, bb: H.bb, bs: encShots(H.bs), tally: H.correct, rank: H.rank, bots: H.botCount

function newPhase(ph, dur) { H.phase = ph; H.dur = dur; H.seq++; H.t0 = Date.now(); }

function hostStart() {

  const humans = [{ peer: S.myPeer, nm: S.name }, ...others.map(p => ({ peer: p.peer, nm: p.presence.nm }))].slice(0, 4);
  const seats = humans.map((h, i) => ({ p: h.peer, nm: String(h.nm || "Player").slice(0, 24), c: i }));
  for (let k = 0; seats.length < 4 && k < H.botCount; k++) seats.push({ p: "bot" + k, nm: BOT_NAMES[k], c: seats.length, bot: 1 });
  if (seats.length < 2) return;

  H.ba = {}; H.bb = {}; H.bs = []; H.correct = {}; H.rank = null; H.bots = {};
  seats.forEach((s, i) => { if (s.bot) { H.bots[i] = { ships: randomFleet(), js: "" }; H.bb[i] = boardFrom(H.bots[i].ships, new Set()); } H.correct[i] = 0; });

// Deals every question once, in groups of three that each mix easy, medium and hard.
function dealBatch() {

  const out = [];
  while (pools.some(p => p.length)) out.push(...shuffle(pools.filter(p => p.length).map(p => p.pop())));
  const last = H.questions[H.questions.length - 1];

}
function hostQuestion() {

  H.ba = {}; H.res = {}; H.ammo = {}; H.targets = []; H.shooters = []; H.fast = null;
  H.botPlan = {};
  H.seats.forEach((s, i) => {
    if (!s.bot) return;
    const right = Math.random() < 0.6;
    let c = H.ansIdx;

      const c = h + d;
      if (!validCell(c) || known.has(c)) continue;
      if ((d === -1 && h % N === 0) || (d === 1 && h % N === N - 1)) continue;
      open.push(c);
    }
  }
  if (open.length && Math.random() < 0.8) return open[rand(open.length)];
  const all = [];
  for (let c = 0; c < N * N; c++) if (!known.has(c)) all.push(c);
  return all.length ? all[rand(all.length)] : null;
}
function hostTick() {
  if (!H || !net) return;
  let G = H.g; if (!G) return;
  const el = hostElapsed();
  let dirty = false;
  // bot fleets: resolve incoming shots
  for (const k in H.bots) {
    const i = +k, bot = H.bots[k];
    const brd = boardFrom(bot.ships, incoming(G, i));
    const js = JSON.stringify(brd);
    if (js !== bot.js) { bot.js = js; H.bb[i] = brd; dirty = true; }
  }
  if (dirty) { pushG(); G = H.g; }
  const seatsIdx = H.seats.map((_, i) => i);
  switch (H.phase) {
    case "place":
      if (el >= H.dur || seatsIdx.every(i => H.seats[i].bot || !present(G, i) || (seatPres(G, i) && seatPres(G, i).rdy))) hostQuestion();
      break;
    case "question": {
      let changed = false;
      for (const k in H.botPlan) { const p = H.botPlan[k]; if (!H.ba[k] && el >= p.at) { H.ba[k] = [H.qi, p.c, Math.round(p.at * 1000)]; changed = true; } }
      if (changed) { pushG(); G = H.g; }
      const done = seatsIdx.every(i => !present(G, i) || (answerOf(G, i) && answerOf(G, i)[0] === H.qi));
      if (done || el >= H.dur) hostReveal();
      break;
    }
    case "reveal":
      if (el >= H.dur) {
        if (H.shooters.length && H.targets.length) { newPhase("fire", 20); pushG(); }
        else hostNext();
      }
      break;
    case "fire": {
      let changed = false;
      H.shooters.forEach((i, n) => {
        if (!H.seats[i].bot) return;
        const fired = H.bs.filter(s => s[0] === H.qi && s[3] === i).length;
        if (fired < (H.ammo[i] || 0) && el >= 1.6 + fired * 1.4 + n * 0.5) {
          const tg = H.targets.filter(t => isAlive(G, t));
          if (!tg.length) return;
          const t = tg[rand(tg.length)], c = botPick(G, t);
          if (c !== null) { H.bs.push([H.qi, t, c, i]); changed = true; }
        }
      });
      if (changed) { pushG(); G = H.g; }
      const liveTargets = H.targets.filter(t => present(G, t) && isAlive(G, t));
      const allFired = H.shooters.every(i => !present(G, i) || firedCount(G, i, H.qi) >= (H.ammo[i] || 0));
      if (el >= H.dur || !liveTargets.length || (allFired && el > 1.2)) { newPhase("damage", 4); pushG(); }
      break;
    }
    case "damage":
      if (el >= H.dur) hostNext();
      break;
  }
}

/* ---------- actions ---------- */
function genCode() { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += A[rand(A.length)]; return s; }
function needName() {
  const nm = (S.name || "").trim();
  if (!nm) { S.note = "Type your name first."; rerenderStatic(); const i = $("#nm"); if (i) i.focus(); return true; }
  return false;
}
async function hostGame(solo) {
  if (needName() || S.busy) return;
  const set = findSet(S.hostCfg.setId);
  const parsed = parseSet(set.text, set.askBy);
  if (parsed.qs.length < 1) { S.note = "That set has no usable questions yet. Edit it and add at least two cards."; rerenderStatic(); return; }
  S.busy = true; S.note = "";
  try {
    if (solo || !roomNS) { net = makeLocalNet(); S.code = "SOLO"; S.solo = true; }
    else {
      S.solo = false;
      for (let tries = 0; ; tries++) {
        S.code = genCode();
        try { net = await makeRoomNet(S.code, true); break; }
        catch (e) { if (!(e && e.type === "unavailable-id") || tries > 3) throw e; }
      }
    }
    S.myPeer = await waitForMe();
  } catch (e) {
    S.busy = false; net = null;
    S.note = "Could not open a game room: " + (e && (e.message || e.code) || "unknown error") + ". You can still play solo.";
    return rerenderStatic();
  }
  S.busy = false; S.isHost = true; S.hadHost = true;
  ME = {}; setMe({ nm: S.name.trim().slice(0, 24) });
  hostOpen(set, solo || S.solo);
  S.screen = "game";
  pushG();
  clearInterval(hostTimer); hostTimer = setInterval(hostTick, 250);
  if (S.solo) hostStart();
}
async function joinGame() {
  if (needName() || S.busy) return;
  const code = (S.joinCode || "").trim().toUpperCase().replace(/[^A-Z]/g, "");
  if (code.length !== 4) { S.joinErr = "Game codes are 4 letters."; return rerenderStatic(); }
  if (!roomNS) { S.joinErr = "The game connection couldn't load. Check your internet and reload the page."; return rerenderStatic(); }
  S.busy = true; S.joinErr = "";
  try { net = await makeRoomNet(code, false); S.myPeer = await waitForMe(); }
  catch (e) { S.busy = false; net = null; S.joinErr = "Could not join: " + (e && (e.message || e.code) || "unknown error"); return rerenderStatic(); }
  S.busy = false; S.isHost = false; S.code = code; S.hadHost = false; S.joinedAt = Date.now();
  ME = {}; setMe({ nm: S.name.trim().slice(0, 24) });
  S.screen = "game";

  setTimeout(scheduleRender, 4500);
}
function leaveGame() {
  clearInterval(hostTimer); hostTimer = null;
  if (net) net.leave();
  net = null; H = null; ME = {}; S.isHost = false; S.code = ""; S.seenSeq = null; S.note = "";
  go("home");
}
function go(screen) { S.screen = screen; S.confirmDel = null; rerenderStatic(true); window.scrollTo(0, 0); }

function placeClick(c) {
  const owner = S.ships.findIndex(sh => sh && sh.includes(c));
  if (owner >= 0 && owner !== S.place.sel) { S.place.sel = owner; return scheduleRender(); }
  const sel = S.place.sel;
  const cells = shipCells(c, SHIPS[sel], S.place.horiz);
  const others = new Set(S.ships.filter((sh, i) => sh && i !== sel).flat());
  if (cells.some(x => others.has(x))) { S.note = "That spot overlaps another ship."; return scheduleRender(); }
  S.note = "";
  S.ships[sel] = cells;
  const nextEmpty = S.ships.findIndex(sh => !sh);
  if (nextEmpty >= 0) S.place.sel = nextEmpty;
  scheduleRender();
}
function rotate() {
  S.place.horiz = !S.place.horiz;
  const sel = S.place.sel, sh = S.ships[sel];
  if (sh) {
    const cells = shipCells(sh[0], SHIPS[sel], S.place.horiz);
    const others = new Set(S.ships.filter((x, i) => x && i !== sel).flat());
    if (!cells.some(x => others.has(x))) S.ships[sel] = cells; else S.note = "No room to turn that ship here. Move it first.";
  }
  scheduleRender();
}
function answer(i) {
  const G = getG();
  if (!G || G.ph !== "question" || mySeat(G) < 0) return;
  if (ME.ans && ME.ans[0] === G.qi) return;
  setMe({ ans: [G.qi, i, Date.now() - S.seenAt] });
  onChange();
}
function fire(t, c) {
  const G = getG(); const me = mySeat(G);
  if (!G || G.ph !== "fire" || me < 0) return;
  const ammo = (G.ammo && G.ammo[me]) || 0;
  const mine = (ME.shots || []).filter(s => s[0] === G.qi);
  if (mine.length >= ammo) return;
  if (!(G.tg || []).includes(t) || !isAlive(G, t)) return;
  if (incoming(G, t).has(c)) return;
  setMe({ shots: [...(ME.shots || []), [G.qi, t, c]] });
  onChange();
}

let rq = false;

function fsButton() { return fsOK() ? `<button class="btn small" data-act="fs">${fsEl() ? "Exit full screen" : "Full screen"}</button>` : ""; }
function enterFS() {
  if (!fsOK() || fsEl()) return;
  const el = document.documentElement;
  try { const r = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch {}
}
function exitFS() { try { const r = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen && document.webkitExitFullscreen(); if (r && r.catch) r.catch(() => {}); } catch {} }
document.addEventListener("fullscreenchange", () => scheduleRender());
document.addEventListener("webkitfullscreenchange", () => scheduleRender());

function lobbyHTML(G) {
  const peers = net.peers().filter(p => p.presence && typeof p.presence.nm === "string");
  const host = peers.find(p => p.presence.g) || null;
  const others = peers.filter(p => !p.presence.g);
  const humans = [host, ...others].filter(Boolean);
  const bots = G.bots || 0;
  const total = Math.min(4, humans.length + bots);
  const list = humans.slice(0, 4).map((p, i) => `<li><span class="fname"><span class="flag" style="background:${flag(i)}"></span><b>${esc(p.presence.nm)}${p.sameTab ? " (you)" : ""}</b></span><span class="tag ${p.presence.g ? "acc" : ""}">${p.presence.g ? "Host" : "Ready to play"}</span></li>`).join("")
    + Array.from({ length: Math.max(0, Math.min(bots, 4 - Math.min(4, humans.length))) }, (_, k) => `<li><span class="fname"><span class="flag" style="background:${flag(Math.min(4, humans.length) + k)}"></span><b>${BOT_NAMES[k]}</b></span><span class="tag">Computer</span></li>`).join("")
    + (humans.length > 4 ? `<li><span class="sub">${humans.length - 4} more ${humans.length - 4 === 1 ? "person is" : "people are"} waiting. Only 4 can play at once.</span></li>` : "");
  const hostCtl = S.isHost ? `
    <div class="row">
      <span class="muted">Computer players</span>
      <button class="btn small" data-act="bot-" ${bots <= 0 ? "disabled" : ""} aria-label="Remove a computer player">−</button>
      <span class="code">${bots}</span>
      <button class="btn small" data-act="bot+" ${total >= 4 ? "disabled" : ""} aria-label="Add a computer player">+</button>
    </div>
    <div class="row"><button class="btn primary" data-act="start" ${total < 2 ? "disabled" : ""}>Start game</button>
      ${total < 2 ? `<span class="sub">Waiting for at least one more player. Add a computer player to practice alone.</span>` : ""}</div>` :
    `<p class="muted">You're in. Waiting for the host to start.</p>`;
  return `<section class="panel">
    <div class="eyebrow">Lobby</div>
    ${!S.solo ? `<h2>Share code <span class="code" style="font-size:1.3em">${esc(S.code)}</span></h2>
    <p class="muted">Friends open this same page, type their name, enter the code and press Join game.</p>` : ""}
    <p class="sub">Question set: <b>${esc(G.title)}</b>${H ? (H.rounds ? " · " + H.rounds + " questions" : " · plays until one fleet is left") : ""}</p>
    <ul class="list">${list}</ul>
    ${hostCtl}
  </section>`;
}

const STAR = (n, r1, r2, rot) => Array.from({ length: n * 2 }, (_, k) => { const r = k % 2 ? r2 : r1, a = rot + Math.PI * k / n; return (Math.cos(a) * r).toFixed(1) + "," + (Math.sin(a) * r).toFixed(1); }).join(" ");
const HIT_SVG = `<svg viewBox="-50 -50 100 100" aria-hidden="true"><g class="burst"><polygon class="b1" points="${STAR(9, 48, 22, 0)}"/><polygon class="b2" points="${STAR(7, 32, 14, .4)}"/><circle class="b3" r="10"/></g></svg>`;
const MISS_SVG = `<svg viewBox="-50 -50 100 100" aria-hidden="true"><circle class="sp0" r="11"/><circle class="sp" r="25" stroke-width="5" opacity=".7"/><circle class="sp" r="40" stroke-width="3" opacity=".35"/></svg>`;
const PEND_SVG = `<svg viewBox="-50 -50 100 100" aria-hidden="true"><circle class="ret" r="34"/></svg>`;
function shipSVG(len, hz) {
  const W = len * 100;
  let p = `<path class="wake" d="M4 30 Q-6 50 4 70"/>`;
  p += `<path class="hl" d="M12 30 Q12 15 30 15 L${W - 78} 15 Q${W - 22} 18 ${W - 5} 50 Q${W - 22} 82 ${W - 78} 85 L30 85 Q12 85 12 70 Z"/>`;
  p += `<path class="dk" d="M26 34 Q26 27 34 27 L${W - 86} 27 Q${W - 44} 31 ${W - 30} 50 Q${W - 44} 69 ${W - 86} 73 L34 73 Q26 73 26 66 Z"/>`;
  p += `<rect class="br" x="34" y="37" width="40" height="26" rx="5"/>`;
  for (let k = 1; k < len; k++) { const cx = k * 100 + 34; p += `<circle class="tu" cx="${cx}" cy="50" r="13"/><rect class="tu" x="${cx}" y="46" width="32" height="8" rx="3"/>`; }
  const g = hz ? p : `<g transform="translate(100 0) rotate(90)">${p}</g>`;
  return `<svg class="shipsvg" viewBox="${hz ? `0 0 ${W} 100` : `0 0 100 ${W}`}" preserveAspectRatio="none" aria-hidden="true">${g}</svg>`;
}
const marksSeen = new Map();
function freshAge(k) { const now = Date.now(); if (!marksSeen.has(k)) marksSeen.set(k, now); return now - marksSeen.get(k); }
function boardHTML({ ships = [], brd = null, mode = "own", t = null, click = false, sel = -1, pend = [], size = "lg", key = null }) {
  const h = new Set(brd ? brd.h : []), m = new Set(brd ? brd.m : []), pendS = new Set(pend);
  const sunkFirst = new Set(brd ? (brd.s || []).map(x => Math.min(...x)) : []);
  const list = mode === "enemy"
    ? (brd ? brd.s || [] : []).map(cells => ({ cells, cls: "sunk" }))
    : ships.map((cells, i) => cells && ({ cells, cls: (mode === "place" && i === sel ? "sel" : "") + (sunkFirst.has(Math.min(...cells)) ? " sunk" : "") })).filter(Boolean);
  let cells = "";
  for (let c = 0; c < N * N; c++) {
    const r = Math.floor(c / N) + 1, col = c % N + 1;
    const label = `${cellName(c)}${h.has(c) ? ", hit" : m.has(c) ? ", miss" : ""}`;
    if (click) {
      const can = mode === "place" || (!h.has(c) && !m.has(c) && !pendS.has(c));
      cells += `<button class="cl" style="grid-area:${r}/${col}" data-act="${mode === "place" ? "place" : "fire"}" data-c="${c}"${t !== null ? ` data-t="${t}"` : ""}${can ? "" : " disabled"} aria-label="${label}"></button>`;
    } else cells += `<span class="cl" style="grid-area:${r}/${col}" aria-label="${label}"></span>`;
  }
  const shipEls = list.map(({ cells: sc, cls }) => {
    const len = sc.length, c0 = Math.min(...sc), hz = len < 2 || Math.abs(sc[1] - sc[0]) === 1;
    const r0 = Math.floor(c0 / N) + 1, k0 = c0 % N + 1;
    const area = hz ? `${r0}/${k0}/span 1/span ${len}` : `${r0}/${k0}/span ${len}/span 1`;
    return `<div class="ship ${cls}" style="grid-area:${area}">${shipSVG(len, hz)}</div>`;
  }).join("");
  let marks = "", newestHit = Infinity;
  const mk = (c, kind, svg) => {
    const r = Math.floor(c / N) + 1, col = c % N + 1;
    let extra = "", style = `grid-area:${r}/${col}`;
    if (key && kind !== "pend") {
      const age = freshAge(key + ":" + c);
      if (age < 1100) { extra = " fresh"; style += `;--d:-${age}ms`; if (kind === "hit") newestHit = Math.min(newestHit, age); }
    }
    marks += `<div class="mk ${kind}${extra}" style="${style}">${svg}</div>`;
  };
  const wreckCells = new Set(brd ? (brd.s || []).flat() : []);
  h.forEach(c => mk(c, wreckCells.has(c) ? "hit wreck" : "hit", HIT_SVG));
  m.forEach(c => mk(c, "miss", MISS_SVG));
  pendS.forEach(c => { if (!h.has(c) && !m.has(c)) mk(c, "pend", PEND_SVG); });
  const shake = mode === "own" && newestHit < 500 ? ` shake" style="--d:-${newestHit}ms` : "";
  const cls = `bd ${size}${mode === "enemy" && click ? " aim" : ""}${mode === "place" ? " place" : ""}${shake}`;
  return `<div class="${cls}" role="grid" aria-label="${N} by ${N} sea grid">
    <div class="bd-cols">${[...COLS].map(x => `<span>${x}</span>`).join("")}</div>
    <div class="bd-rows">${Array.from({ length: N }, (_, i) => `<span>${i + 1}</span>`).join("")}</div>
    <div class="sea">${cells}${shipEls}${marks}</div></div>`;
}
function cleanBrd(b) {
  if (!b || typeof b !== "object") return null;
  const arr = a => Array.isArray(a) ? a.filter(validCell) : [];
  return { h: arr(b.h), m: arr(b.m), s: Array.isArray(b.s) ? b.s.filter(Array.isArray).map(arr).filter(x => x.length) : [], left: Number.isFinite(b.left) ? b.left : TOTAL, alive: b.alive !== false };
}

function placeHTML(G, seat) {
  if (ME.rdy) {
    const waiting = G.seats.map((_, i) => i).filter(i => !G.seats[i].bot && present(G, i) && !(seatPres(G, i) && seatPres(G, i).rdy));
    return `<section class="panel"><div class="split">
      <div class="board-wrap"><div class="board-title">Your fleet is set</div>${boardHTML({ ships: S.ships, size: "lg" })}</div>
      <div class="stack"><h2>Ready for battle</h2>
      <p class="muted">${waiting.length ? "Waiting on " + waiting.map(i => plainName(G, i)).join(", ") + "." : "Everyone's ready. First question coming up."}</p></div>
    </div></section>`;
  }
  const all = S.ships.every(Boolean);
  return `<section class="panel"><div class="split">
    <div class="board-wrap"><div class="board-title">Place your fleet</div>
      ${boardHTML({ ships: S.ships, mode: "place", click: true, sel: S.place.sel, size: "lg" })}</div>
    <div class="stack">
      <p class="muted">Pick a ship, then tap the grid where it should start. Tap a placed ship to pick it up again. Other players never see where your ships are.</p>
      ${SHIPS.map((len, i) => `<button class="shipbtn ${S.place.sel === i ? "on" : ""}" data-act="pick" data-i="${i}"><span class="pips">${"<i></i>".repeat(len)}</span>${SHIP_NAMES[i]} · ${len}${S.ships[i] ? "" : " <span class='tag bad'>not placed</span>"}</button>`).join("")}
      <div class="row">
        <button class="btn small" data-act="rotate">Turn ship (${S.place.horiz ? "across" : "down"})</button>
        <button class="btn small" data-act="shuffle">Random spots</button>
      </div>
      ${S.note ? `<p class="err">${esc(S.note)}</p>` : ""}
      <button class="btn primary" data-act="ready" ${all ? "" : "disabled"}>Lock in my fleet</button>
      <p class="sub">If time runs out, your fleet locks as it is.</p>
    </div>
  </div></section>`;
}

function questionHTML(G, seat) {
  const q = G.q || { t: "", ch: [] };
  const reveal = G.ph === "reveal";
  const my = ME.ans && ME.ans[0] === G.qi ? ME.ans[1] : null;
  const choices = q.ch.map((c, i) => {
    const cls = ["ch", "ch" + (i % 4)];
    if (reveal) { if (i === G.ai) cls.push("right"); else cls.push("dim"); if (i === my) cls.push("picked"); }
    else if (my !== null) { if (i === my) cls.push("picked"); else cls.push("dim"); }
    return `<button class="${cls.join(" ")}" data-act="ans" data-i="${i}" ${reveal || my !== null ? "disabled" : ""}><span class="k">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`;
  }).join("");
  let foot = "";
  if (!reveal) {
    const answered = G.seats.filter((_, i) => { const a = answerOf(G, i); return a && a[0] === G.qi; }).length;
    const dead = !isAlive(G, seat);
    foot = `<p class="muted">${my !== null ? "Answer locked. " : ""}${answered} of ${G.seats.length} answered.${dead ? " Your fleet is sunk, but right answers still earn you shells." : ""}</p>`;
  } else {
    const r = G.res ? G.res[seat] : -1;
    const ammo = G.ammo ? G.ammo[seat] || 0 : 0;
    const anyWrong = (G.tg || []).length > 0, anyRight = (G.sh || []).length > 0;
    let msg, cls;
    if (!anyRight) { msg = "Nobody got it right. No shells this round."; cls = ""; }
    else if (!anyWrong) { msg = r === 1 ? "Correct! Nobody else missed, so every fleet is safe." : "Every fleet still afloat is safe this round."; cls = r === 1 ? "good" : ""; }
    else if (r === 1) { msg = G.lone && ammo > 1 ? `You're the only one who got it right! You earned ${ammo} shells. Fire them at any boards you like.` : "Correct! You earned 1 shell. Get ready to fire."; cls = "good"; }
    else if (r === 0) { msg = isAlive(G, seat) ? "Wrong answer. You're a target this round." : "Wrong answer."; cls = "bad"; }
    else { msg = isAlive(G, seat) ? "Time ran out. You're a target this round." : "Time ran out."; cls = "bad"; }
    const who = G.seats.map((_, i) => `<span class="tag ${G.res[i] === 1 ? "ok" : "bad"}">${plainName(G, i)} ${G.res[i] === 1 ? "✓" : G.res[i] === 0 ? "✗" : "no answer"}</span>`).join("");
    foot = `<div class="banner ${cls}">${msg}</div><div class="tags">${who}</div>`;
  }
  return `<div class="qlayout"><div class="stack" style="gap:16px">
    <div class="qcard"><div class="row" style="justify-content:space-between"><div class="eyebrow">Question ${G.qi + 1}${G.n ? " of " + G.n : ""}</div>${q.d ? `<span class="lvl ${q.d}">${q.d === "easy" ? "Easy" : q.d === "medium" ? "Medium" : "Hard"}</span>` : ""}</div><h2 class="qtext">${esc(q.t)}</h2></div>
    <div class="choices">${choices}</div>${foot}</div>
    <aside class="minifleet"><div class="eyebrow">Your fleet</div>${boardHTML({ ships: S.ships, brd: cleanBrd(ME.brd), size: "sm", key: G.gid + ":" + seat })}</aside></div>`;
}

const shipName = len => len === 4 ? "Battleship (4)" : len === 2 ? "Destroyer (2)" : "3-long ship";
function sunkList(b) {
  const sunk = b && b.s ? b.s : [];
  return `<div class="sunklist">${sunk.length ? "Sunk: " + sunk.map(x => `<span class="tag">${shipName(x.length)}</span>`).join("") : "No ships sunk yet"} · ${SHIPS.length - sunk.length} of ${SHIPS.length} ships left</div>`;
}
function watchBoards(G, idxs, opts = {}) {
  return `<div class="boards">${idxs.map(i => {
    const b = seatBoard(G, i);
    const dead = b && b.alive === false;
    return `<div class="board-wrap"><div class="board-title">${nameTag(G, i)}${dead ? ` <span class="tag bad">Sunk</span>` : ""}</div>
      ${boardHTML({ brd: b, mode: "enemy", t: i, click: !!opts.click && !dead, pend: opts.pend ? opts.pend(i) : [], size: opts.size || (idxs.length > 2 ? "md3" : idxs.length > 1 ? "md" : "lg"), key: G.gid + ":" + i })}
      ${sunkList(b)}</div>`;
  }).join("")}</div>`;
}
function fireHTML(G, seat) {
  const ammo = (G.ammo && G.ammo[seat]) || 0;
  const mine = (ME.shots || []).filter(s => s[0] === G.qi);
  const left = Math.max(0, ammo - mine.length);
  const targets = (G.tg || []);
  const pend = t => mine.filter(s => s[1] === t).map(s => s[2]).filter(c => { const b = seatBoard(G, t); return !b || (!b.h.includes(c) && !b.m.includes(c)); });
  if (ammo > 0) {
    return `<section class="panel">
      <div class="row" style="justify-content:space-between"><h2>${left ? (ammo > 1 ? `Only one who got it right! ${left} shell${left === 1 ? "" : "s"} left` : "Fire! 1 shell") : "Shell away"}</h2>
      <span class="sub">${ammo > 1 && left ? "Pick a board for each shell. Spread them out or hit one player with all of them." : "Tap a square on a target's grid. A fireball is a hit, splash rings are a miss."}</span></div>
      ${watchBoards(G, targets, { click: left > 0, pend })}
    </section>`;
  }
  if (targets.includes(seat)) {
    const shooters = (G.sh || []).map(i => plainName(G, i)).join(", ");
    return `<section class="panel"><div class="split">
      <div class="board-wrap"><div class="board-title">Your fleet</div>${boardHTML({ ships: S.ships, brd: cleanBrd(ME.brd), size: "lg", key: G.gid + ":" + seat })}</div>
      <div class="stack"><h2>Incoming fire!</h2><p class="muted">${shooters} ${(G.sh || []).length === 1 ? "is" : "are"} aiming at the players who missed. Watch your grid.</p></div>
    </div></section>`;
  }
  return `<section class="panel"><h2>Shots are being fired</h2>${watchBoards(G, targets)}</section>`;
}
function damageHTML(G, seat) {
  const shots = allShots(G).filter(s => s[0] === G.qi);
  const rows = shots.map(([, t, c, sh]) => {
    const b = seatBoard(G, t);
    const hit = b && b.h.includes(c);
    const sunkShip = b && (b.s || []).find(x => x.includes(c));
    return `<li><span class="flag" style="background:${flag(G.seats[sh] ? G.seats[sh].c : 0)}"></span>${plainName(G, sh)} → ${plainName(G, t)} at <span class="code">${cellName(c)}</span> <span class="tag ${hit ? "bad" : ""}">${sunkShip ? "Sunk a ship" : hit ? "Hit" : "Miss"}</span></li>`;
  }).join("");
  const targets = G.tg || [];
  return `<section class="panel"><div class="eyebrow">Damage report</div>
    <ul class="report">${rows || `<li class="muted">No shells were fired.</li>`}</ul>
    ${targets.includes(seat) ? `<div class="board-wrap"><div class="board-title">Your fleet</div>${boardHTML({ ships: S.ships, brd: cleanBrd(ME.brd), size: "lg", key: G.gid + ":" + seat })}</div>` : watchBoards(G, targets)}
  </section>`;
}
function overHTML(G, seat) {
  const rank = G.rank || G.seats.map((_, i) => i);
  const win = rank[0];
  const rows = rank.map((i, k) => {
    const b = seatBoard(G, i);
    const left = b ? b.left : TOTAL;
    return `<div class="rank"><span class="pos">${k + 1}</span><span class="fname" style="flex:1;min-width:0"><span class="flag" style="background:${flag(G.seats[i].c)}"></span><span class="who"><b>${plainName(G, i)}</b><span class="sub">${left} of ${TOTAL} ship squares left · ${(G.tally && G.tally[i]) || 0} right answers</span></span></span>${isAlive(G, i) ? `<span class="tag ok">Afloat</span>` : `<span class="tag bad">Sunk</span>`}</div>`;
  }).join("");
  return `<section class="panel">
    <div class="eyebrow">Game over</div>
    <h2 class="qtext">${win === seat ? "You win! Your fleet rules the sea." : `${plainName(G, win)} wins.`}</h2>
    <div>${rows}</div>
    <div class="row">${S.isHost ? `<button class="btn primary" data-act="again">Play again${S.solo ? "" : " with this group"}</button>` : `<span class="muted">The host can start another game.</span>`}
    <button class="btn" data-act="leave">Leave</button></div>
  </section>`;
}
function shipPips(b) {
  const sunk = (b && b.s ? b.s : []).map(x => x.length);
  return [...SHIPS].sort((x, y) => y - x).map(len => { const k = sunk.indexOf(len); if (k >= 0) sunk.splice(k, 1); return `<i class="${k >= 0 ? "x" : ""}" style="width:${len * 9}px"></i>`; }).join("");
}
function fleetHTML(G) {
  return `<div class="fleet">${G.seats.map((st, i) => {
    const b = seatBoard(G, i);
    const left = b ? b.left : TOTAL;
    const dead = b && b.alive === false;
    const tags = [];
    if (G.ph === "question") { const a = answerOf(G, i); tags.push(a && a[0] === G.qi ? `<span class="tag ok">Answered</span>` : `<span class="tag">Thinking</span>`); }
    if ((G.ph === "fire" || G.ph === "damage" || G.ph === "reveal") && (G.tg || []).includes(i)) tags.push(`<span class="tag bad">Target</span>`);
    if ((G.ph === "fire" || G.ph === "reveal") && G.ammo && G.ammo[i]) tags.push(`<span class="tag acc">${G.ammo[i]} shell${G.ammo[i] === 1 ? "" : "s"}</span>`);
    if (dead) tags.push(`<span class="tag bad">Sunk</span>`);
    if (st.bot) tags.push(`<span class="tag">Computer</span>`);
    if (!present(G, i)) tags.push(`<span class="tag">Left</span>`);
    return `<div class="fcard ${dead ? "dead" : ""}">
      <div class="fname">${nameTag(G, i)}</div>
      <div class="shipcount" aria-label="${SHIPS.length - (b && b.s ? b.s.length : 0)} of ${SHIPS.length} ships left">${shipPips(b)}</div>
      <div class="hull" aria-label="${left} of ${TOTAL} ship squares left">${Array.from({ length: TOTAL }, (_, k) => `<i class="${k < left ? "" : "x"}"></i>`).join("")}</div>
      <div class="tags"><span class="sub">${(G.tally && G.tally[i]) || 0} right</span>${tags.join("")}</div>
    </div>`;
  }).join("")}</div>`;
}

/* ---------- events ---------- */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case "to-host": if (!needName()) { S.note = ""; go("host"); } break;
    case "home": S.note = ""; go("home"); break;
    case "to-sets": S.note = ""; S.editing = null; go("sets"); break;
    case "solo": if ((S.name || "").trim()) enterFS(); hostGame(true); break;
    case "host": enterFS(); hostGame(false); break;
    case "join": if ((S.name || "").trim()) enterFS(); joinGame(); break;
    case "leave": exitFS(); leaveGame(); break;
    case "fs": fsEl() ? exitFS() : enterFS(); break;
    case "new-set": S.editing = { id: null, title: "", text: "", askBy: "def", src: S.canEdit && db ? "shared" : "local" }; S.note = ""; go("edit"); break;
    case "edit": { const s = findSet(id); S.editing = { ...s }; S.note = ""; go("edit"); break; }
    case "copy": { const s = findSet(id); S.editing = { id: null, title: s.title.replace(/^Sample:\s*/, "") + " (copy)", text: s.text, askBy: s.askBy, src: S.canEdit && db ? "shared" : "local" }; S.note = ""; go("edit"); break; }
    case "save-set": saveSet(); break;
    case "del": S.confirmDel = id; rerenderStatic(true); break;
    case "del-no": S.confirmDel = null; rerenderStatic(true); break;
    case "del-yes": deleteSet(id); break;
    case "bot+": if (H) { H.botCount = Math.min(3, H.botCount + 1); pushG(); } break;
    case "bot-": if (H) { H.botCount = Math.max(0, H.botCount - 1); pushG(); } break;
    case "start": if (H) hostStart(); break;
    case "end": if (H && !["lobby", "over"].includes(H.phase)) hostOver(); break;
    case "again": if (H) { if (S.solo) hostStart(); else { H.phase = "lobby"; H.seq++; H.dur = 0; pushG(); } } break;
    case "place": placeClick(+b.dataset.c); break;
    case "pick": S.place.sel = +b.dataset.i; S.note = ""; scheduleRender(); break;
    case "rotate": S.note = ""; rotate(); break;
    case "shuffle": S.ships = randomFleet(); S.note = ""; scheduleRender(); break;
    case "ready": if (S.ships.every(Boolean)) { setMe({ rdy: true }); onChange(); } break;
    case "ans": answer(+b.dataset.i); break;
    case "fire": fire(+b.dataset.t, +b.dataset.c); break;
  }
});
app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "nm") { S.name = t.value; store.set("xb.name", t.value); }
  else if (t.id === "jc") { S.joinCode = t.value.toUpperCase(); }
  else if (t.id === "sx" || t.id === "st") updatePreview();
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "setpick") { S.hostCfg.setId = t.value; store.set("xb.cfg2", S.hostCfg); }
  else if (t.id === "rounds") { S.hostCfg.rounds = +t.value; store.set("xb.cfg2", S.hostCfg); }
  else if (t.id === "secs") { S.hostCfg.secs = +t.value; store.set("xb.cfg2", S.hostCfg); }
  else if (t.id === "sa") updatePreview();
});
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "jc") { if ((S.name || "").trim()) enterFS(); joinGame(); }
  if (S.screen === "game" && (e.key === "r" || e.key === "R") && !e.target.closest("input,textarea")) { const G = getG(); if (G && G.ph === "place" && !ME.rdy) rotate(); }
});
// keep the countdown moving between updates
setInterval(() => {
  if (S.screen !== "game") return;
  const G = getG(), el = $("#timer");
  if (!G || !el) return;
  const t = timeLeft(G); if (t === null) return;
  el.querySelector("span").textContent = Math.ceil(t) + "s";
  el.querySelector(".bar i").style.width = Math.max(0, Math.min(100, t / G.dur * 100)) + "%";
  el.classList.toggle("low", t <= 5);
}, 200);
window.addEventListener("pagehide", () => { if (net) net.leave(); });

rerenderStatic(true);
})();
</script>
</body>
