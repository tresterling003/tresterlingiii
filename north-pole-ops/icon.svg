<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#c8102e"/><stop offset=".55" stop-color="#5a0a1e"/><stop offset="1" stop-color="#0a1420"/></radialGradient>
 <radialGradient id="ball" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e4f2ff"/><stop offset="1" stop-color="#7fa9d6"/></radialGradient>
 <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#9fd3ff" stop-opacity=".55"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a0"/><stop offset="1" stop-color="#d89a22"/></linearGradient>
 <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b4e"/><stop offset="1" stop-color="#9c0a1f"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<g fill="#fff" opacity=".7">
 <circle cx="70" cy="90" r="4"/><circle cx="440" cy="70" r="5"/><circle cx="90" cy="420" r="3"/><circle cx="455" cy="400" r="4"/><circle cx="400" cy="150" r="2.5"/><circle cx="120" cy="250" r="2.5"/><circle cx="380" cy="460" r="3"/><circle cx="40" cy="330" r="2"/>
</g>
<circle cx="256" cy="272" r="150" fill="url(#glow)"/>
<!-- reticle -->
<g stroke="url(#gold)" stroke-width="14" fill="none" stroke-linecap="round" filter="url(#sh)">
 <circle cx="256" cy="272" r="170" stroke-dasharray="190 77" transform="rotate(-50 256 272)"/></g>
<g stroke="#f2b93b" stroke-width="14" stroke-linecap="round" filter="url(#sh)">
 <line x1="256" y1="72" x2="256" y2="132"/><line x1="256" y1="412" x2="256" y2="472"/>
 <line x1="56" y1="272" x2="116" y2="272"/><line x1="396" y1="272" x2="456" y2="272"/>
</g>
<!-- snowball -->
<g filter="url(#sh)">
 <circle cx="256" cy="286" r="112" fill="url(#ball)"/>
 <g fill="#b9d4ee" opacity=".8"><circle cx="300" cy="330" r="10"/><circle cx="215" cy="345" r="7"/><circle cx="330" cy="275" r="6"/><circle cx="235" cy="300" r="5"/><circle cx="285" cy="365" r="6"/></g>
 <ellipse cx="215" cy="240" rx="34" ry="20" fill="#fff" opacity=".9" transform="rotate(-30 215 240)"/>
 <!-- angry eyes: it's on the naughty list -->
 <path d="M205 272 l34 12" stroke="#13203a" stroke-width="9" stroke-linecap="round"/>
 <path d="M307 272 l-34 12" stroke="#13203a" stroke-width="9" stroke-linecap="round"/>
 <circle cx="226" cy="298" r="10" fill="#13203a"/><circle cx="286" cy="298" r="10" fill="#13203a"/>
 <path d="M228 338 q30 16 56 -8" stroke="#13203a" stroke-width="8" fill="none" stroke-linecap="round"/>
</g>
<!-- santa hat -->
<g filter="url(#sh)">
 <path d="M162 214 C172 128 250 92 318 104 C370 114 400 150 402 196 C384 180 364 170 344 172 C350 188 352 200 350 212 Z" fill="url(#hat)"/>
 <path d="M150 212 Q256 176 356 214 Q362 236 352 248 Q256 212 160 246 Q146 232 150 212 Z" fill="#fff"/>
 <circle cx="398" cy="200" r="24" fill="#fff"/>
