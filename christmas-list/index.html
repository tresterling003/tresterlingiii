<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<title>My Christmas List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style id="css">
/* VOICE  calm, premium product page; the list reads like a store you already trust
   IDEA   a product launch page: frosted nav, big tight headline, bento spec tiles, product cards
   PICTURE the product grid itself, each wish a card with a photo stage that lifts on hover
   COLOUR  #f5f5f7 ground, white cards, near-black ink, system blue actions, one festive red for Top wish
   TYPE    system SF Pro (Inter fallback), heavy display with tight tracking
   LAYOUT  nav bar, hero headline, bento about-me, segmented filter, 3/2/1 column grid */
:root{color-scheme:light dark;--bg:light-dark(#f5f5f7,#000);--card:light-dark(#fff,#1c1c1e);--card2:light-dark(#fbfbfd,#2c2c2e);--ink:light-dark(#1d1d1f,#f5f5f7);--muted:light-dark(#6e6e73,#98989d);--line:light-dark(#d2d2d7,#38383a);--blue:light-dark(#0071e3,#0a84ff);--link:light-dark(#0066cc,#2997ff);--red:light-dark(#d70015,#ff453a);--green:light-dark(#248a3d,#30d158);--fill:light-dark(rgba(118,118,128,.12),rgba(118,118,128,.24));--glass:light-dark(rgba(251,251,253,.72),rgba(22,22,23,.72));--sh:light-dark(0 2px 12px rgba(0,0,0,.06),0 0 0 1px rgba(255,255,255,.06));--shh:light-dark(0 18px 48px rgba(0,0,0,.14),0 18px 48px rgba(0,0,0,.6));--ease:cubic-bezier(.28,.11,.32,1);--spring:cubic-bezier(.34,1.36,.64,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;letter-spacing:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
nav{position:sticky;top:0;z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid light-dark(rgba(0,0,0,.08),rgba(255,255,255,.1));padding-top:env(safe-area-inset-top,0px)}
nav .wrap{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark svg{flex:none}
.hero{padding-top:clamp(40px,8vw,88px);padding-bottom:clamp(28px,5vw,48px)}
.eyebrow{color:var(--red);font-weight:600;font-size:clamp(17px,2vw,21px);margin:0 0 6px}
h1{font:800 clamp(44px,8vw,80px)/1.04 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.045em;margin:0;text-wrap:balance}
.lede{font-size:clamp(19px,2.4vw,24px);line-height:1.35;color:var(--muted);max-width:30em;margin:14px 0 0;font-weight:500;letter-spacing:-.02em}
h2{font:700 clamp(28px,4vw,40px)/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.035em;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 20px;border-radius:980px;border:0;cursor:pointer;font-size:17px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .3s var(--ease),transform .3s var(--spring),opacity .3s}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible,.sw input:focus-visible+i{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.b-blue{background:var(--blue);color:#fff}
.b-blue:hover{background:light-dark(#0077ed,#409cff)}
.b-fill{background:var(--fill);color:var(--ink)}
.b-fill:hover{background:light-dark(rgba(118,118,128,.2),rgba(118,118,128,.34))}
.b-sm{min-height:32px;padding:0 14px;font-size:14px}
.b-red{background:transparent;color:var(--red)}
.tlink{color:var(--link);text-decoration:none;font-weight:500;white-space:nowrap}
.tlink:hover{text-decoration:underline}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--sh)}
.tile.wide{grid-column:span 2}
.tile .k{color:var(--muted);font-size:14px;font-weight:600;margin:0 0 8px}
.tile .v{font-size:19px;font-weight:600;line-height:1.3;margin:0}
.specgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:16px 18px}
.spec b{display:block;font:700 clamp(28px,3.4vw,36px)/1.05 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.03em;white-space:nowrap}
.spec span{color:var(--muted);font-size:14px}
.legend{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.legend li{display:flex;gap:10px;align-items:baseline;font-size:15px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:980px;white-space:nowrap;flex:none;letter-spacing:-.01em}
.p-exact{background:var(--ink);color:var(--bg)}
.p-idea{background:var(--fill);color:var(--ink)}
.p-top{background:var(--red);color:#fff}
.section{padding-top:clamp(48px,7vw,80px)}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:22px}
.head h2{margin:0}
.segwrap{overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:4px}
.segwrap::-webkit-scrollbar{display:none}
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:10px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:0 16px;min-height:34px;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .3s}
.seg button[aria-pressed=true]{font-weight:600}
.seg .ind{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:8px;background:light-dark(#fff,#636366);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:left .45s var(--spring),width .45s var(--spring)}
.note{font-size:15px;color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.item{background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
@media (hover:hover){.item:hover{transform:translateY(-6px) scale(1.015);box-shadow:var(--shh)}.item:hover .pic img{transform:scale(1.06)}}
.pic{aspect-ratio:1/1;background:linear-gradient(180deg,var(--card2),light-dark(#f0f0f3,#242426));display:grid;place-items:center;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:contain;padding:8%;transition:transform .7s var(--ease)}
.pic.blank{aspect-ratio:auto;height:150px;padding-top:34px}
.ph{font:700 44px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.04em;color:light-dark(#c7c7cc,#48484a)}
.pills{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.brand{color:var(--red);font-size:13px;font-weight:600;letter-spacing:-.01em}
.item h3{font:700 22px/1.18 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.03em;margin:0}
.meta{color:var(--muted);font-size:15px;margin:0}
.meta b{color:var(--ink);font-weight:600}
.item p{margin:0;font-size:15px;line-height:1.45}
.buy{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:auto;padding-top:10px}
.need{color:light-dark(#b25000,#ff9f0a);font-size:14px;font-weight:500}
.editrow{padding-top:8px}
.empty{background:var(--card);border-radius:22px;padding:48px 24px;text-align:center;grid-column:1/-1;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:21px;margin-bottom:4px}
.dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translate(-50%,0);z-index:12;display:flex;gap:6px;align-items:center;padding:6px;border-radius:980px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.18),0 0 0 1px light-dark(rgba(0,0,0,.06),rgba(255,255,255,.1));max-width:calc(100vw - 24px);overflow-x:auto;animation:dockIn .6s var(--spring) both}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,30px) scale(.9)}}
.dock .btn{min-height:40px;padding:0 16px;font-size:15px}
footer{color:var(--muted);font-size:13px;padding:56px 0 120px;border-top:1px solid var(--line);margin-top:64px}
footer .wrap{padding-top:16px}
dialog{border:0;padding:0;border-radius:14px;width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:sheetIn .5s var(--spring)}
dialog.closing{animation:sheetOut .25s var(--ease) forwards}
dialog::backdrop{background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog[open]::backdrop{animation:fade .3s ease}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes sheetOut{to{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes fade{from{opacity:0}}
.sheethd{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 14px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.sheethd h3{margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap}
.sheethd .r{justify-self:end}
.txtbtn{background:none;border:0;color:var(--link);font-size:17px;cursor:pointer;min-height:44px;padding:0 6px}
.txtbtn.strong{font-weight:600}
.txtbtn:disabled{opacity:.4}
.form{padding:18px 16px 24px;display:grid;gap:22px}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.grp-t{font-size:13px;color:var(--muted);margin:0 0 6px 16px;text-transform:none}
.grp-f{font-size:13px;color:var(--muted);margin:6px 16px 0;line-height:1.35}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.row label{flex:none;width:6.2em;font-size:17px}
.row input,.row textarea{flex:1;border:0;background:none;font-size:17px;line-height:1.35;font-family:inherit;color:var(--ink);padding:12px 0;width:100%;letter-spacing:-.02em}
.row input:focus,.row textarea:focus{outline:none}
.row textarea{min-height:88px;resize:vertical}
.row.tall{align-items:flex-start}
.row.tall label{padding-top:12px}
.sw{margin-left:auto;position:relative;display:inline-block;width:51px;height:31px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:31px;background:light-dark(#e9e9ea,#39393d);transition:background .3s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .35s var(--spring)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}
.kind{display:flex;width:100%}
.kind button{flex:1}
.photo{display:flex;align-items:center;gap:14px;padding:12px 16px}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--fill)}
.photo label{color:var(--link);cursor:pointer;font-size:17px}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.del{display:block;width:100%;text-align:center;background:var(--card);border:0;border-radius:12px;color:var(--red);font-size:17px;min-height:46px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;display:flex;gap:14px;align-items:center;padding:12px 20px;border-radius:980px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.16),0 0 0 1px light-dark(rgba(0,0,0,.06),rgba(255,255,255,.1));font-size:15px;font-weight:500;max-width:calc(100vw - 32px);animation:toastIn .5s var(--spring)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-16px) scale(.94)}}
#toast button{background:none;border:0;color:var(--link);font-weight:600;cursor:pointer;min-height:32px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}.bento{grid-template-columns:minmax(0,1fr)}.tile.wide{grid-column:auto}dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:14px 14px 0 0;max-height:calc(100dvh - 44px)}@keyframes sheetIn{from{transform:translateY(100%)}}@keyframes sheetOut{to{transform:translateY(100%)}}.pic{aspect-ratio:4/3}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<script type="text/html" id="shell">
<nav><div class="wrap">
  <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 7h-2.2A3 3 0 0 0 12 3.8 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h.5v8a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-8h.5a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1Zm-5.5-2a1 1 0 1 1 0 2H13v-.3A1.7 1.7 0 0 1 14.5 5Zm-5 0a1.7 1.7 0 0 1 1.5 1.7V7H9.5a1 1 0 1 1 0-2ZM5 9h6v1H5Zm1.5 3H11v7.5H6.5Zm11 7.5H13V12h4.5ZM19 10h-6V9h6Z"/></svg><span id="navName">Christmas List</span></div>
  <div id="navAct"></div>
</div></nav>
<header class="wrap hero">
  <p class="eyebrow" id="eyebrow">Holiday wish list</p>
  <h1 id="title">My Christmas list.</h1>
  <p class="lede" id="intro"></p>
</header>
<main>
  <section class="wrap" aria-labelledby="aboutH">
    <h2 id="aboutH" class="rv">Get to know the fit.</h2>
    <div class="bento" id="about"></div>
  </section>
  <section class="wrap section" aria-labelledby="listH">
    <div class="head rv"><h2 id="listH">The list.</h2>
      <div class="segwrap"><div class="seg" id="filters" role="toolbar" aria-label="Filter the list"></div></div></div>
    <p class="note" id="sampleNote" hidden>These are sample wishes so you can see how it looks. Tap Edit to replace them with yours.</p>
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="dock"></div>

<dialog id="itemDlg"><form id="itemForm" method="dialog">
  <div class="sheethd"><button type="button" class="txtbtn" data-close>Cancel</button><h3 id="itemH">New Wish</h3><button type="submit" class="txtbtn strong r" id="fSave">Done</button></div>
  <div class="form">
    <div class="seg kind" role="radiogroup" aria-label="Kind"><span class="ind"></span><button type="button" id="kExact" data-kind="exact" aria-pressed="true">Exact pick</button><button type="button" id="kIdea" data-kind="idea" aria-pressed="false">Gift idea</button></div>
    <div><div class="grp">
      <div class="row"><label for="fTitle">Item</label><input id="fTitle" required maxlength="120" placeholder="Tech Fleece joggers"></div>
      <div class="row"><label for="fBrand">Brand</label><input id="fBrand" maxlength="60" placeholder="Nike"></div>
      <div class="row"><label for="fCat">Category</label><input id="fCat" list="cats" maxlength="40" placeholder="Clothes"></div>
      <div class="row"><label for="fTop">Top wish</label><span class="sw"><input type="checkbox" id="fTop" role="switch"><i></i></span></div>
    </div></div>
    <div><p class="grp-t">Details</p><div class="grp">
      <div class="row"><label for="fSize">Size</label><input id="fSize" maxlength="40" placeholder="M"></div>
      <div class="row"><label for="fColor">Color</label><input id="fColor" maxlength="60" placeholder="Black"></div>
      <div class="row"><label for="fPrice">Price</label><input id="fPrice" maxlength="30" placeholder="$110"></div>
    </div></div>
    <datalist id="cats"></datalist>
    <div><p class="grp-t">Where to buy</p><div class="grp">
      <div class="row tall"><label for="fLinks">Links</label><textarea id="fLinks" placeholder="https://www.nike.com/..."></textarea></div>
    </div><p class="grp-f">Paste the link from the store's page. One per line.</p></div>
    <div><p class="grp-t">Photo</p><div class="grp"><div class="photo"><img id="fPrev" alt="" hidden><label for="fPhoto" id="fPhotoL">Choose photo</label><input type="file" id="fPhoto" accept="image/*"><button type="button" class="txtbtn" id="fNoPhoto" style="margin-left:auto;color:var(--red)" hidden>Remove</button></div></div>
      <p class="grp-f">Screenshot the product on your phone, then choose it here.</p></div>
    <div><p class="grp-t">Notes for whoever shops</p><div class="grp">
      <div class="row tall"><label for="fNotes" style="width:auto"></label><textarea id="fNotes" maxlength="600" placeholder="Fit, style, what I already have…" aria-label="Notes"></textarea></div>
    </div></div>
    <button type="button" class="del" id="fDel" hidden>Delete Wish</button>
  </div>
</form></dialog>

<dialog id="aboutDlg"><form id="aboutForm" method="dialog">
  <div class="sheethd"><button type="button" class="txtbtn" data-close>Cancel</button><h3>About Me</h3><button type="submit" class="txtbtn strong r">Done</button></div>
  <div class="form">
    <div><div class="grp">
      <div class="row"><label for="aName">Name</label><input id="aName" maxlength="40" placeholder="Your name"></div>
      <div class="row tall"><label for="aIntro">Note</label><textarea id="aIntro" maxlength="300" placeholder="A note to your family"></textarea></div>
    </div></div>
    <div><p class="grp-t">Sizes</p><div class="grp"><div class="row tall"><label for="aSizes">Sizes</label><textarea id="aSizes" placeholder="Shoe: 10.5"></textarea></div></div><p class="grp-f">One per line, like "Shirt: M".</p></div>
    <div><p class="grp-t">Favorites</p><div class="grp">
      <div class="row"><label for="aColors">Colors</label><input id="aColors" maxlength="120"></div>
      <div class="row"><label for="aBrands">Brands</label><input id="aBrands" maxlength="160"></div>
      <div class="row"><label for="aInto">Into lately</label><input id="aInto" maxlength="200"></div>
      <div class="row"><label for="aNo">Please skip</label><input id="aNo" maxlength="160"></div>
    </div></div>
  </div>
</form></dialog>

<dialog id="importDlg"><form id="importForm" method="dialog">
  <div class="sheethd"><button type="button" class="txtbtn" data-close>Cancel</button><h3>Paste from Notes</h3><button type="submit" class="txtbtn strong r">Add</button></div>
  <div class="form"><div><div class="grp"><div class="row tall"><textarea id="iText" style="min-height:220px" aria-label="Your list" placeholder="Nike Tech Fleece joggers&#10;Dunks&#10;idea: stuff for my room"></textarea></div></div>
  <p class="grp-f">Copy your list out of Notes and paste it here. Each line becomes a wish you can fill in. Start a line with "idea:" to make it a gift idea.</p></div></div>
</form></dialog>
<div id="toast" role="status" hidden></div>
</script>

<script type="application/json" id="state">{"sample":true,"about":{"name":"","intro":"Everything here is a guide, not a rule. If you see something that made you think of me, go for it.","sizes":["Shirt: M","Hoodie: L","Pants: 32x30","Shoe: 10.5"],"colors":"Black, grey, olive green","brands":"Nike, Carhartt, Target","into":"Basketball, the gym, music, gaming","no":"Cologne, candles"},"items":[{"id":"s1","kind":"exact","top":true,"title":"Tech Fleece joggers","brand":"Nike","cat":"Clothes","price":"about $110","size":"M","color":"Black","links":["https://www.nike.com/w/tech-fleece"],"img":"","notes":"Slim fit, the newer style with the zip pockets."},{"id":"s2","kind":"exact","top":false,"title":"Dunk Low sneakers","brand":"Nike","cat":"Shoes","price":"about $115","size":"10.5","color":"Black and white","links":["https://www.nike.com/w/dunk-shoes"],"img":"","notes":""},{"id":"s3","kind":"idea","top":false,"title":"Something for the gym","brand":"","cat":"Fitness","price":"","size":"","color":"","links":[],"img":"","notes":"A good water bottle, lifting straps, a gym bag. Surprise me."},{"id":"s4","kind":"idea","top":true,"title":"Stuff to make my room feel better","brand":"","cat":"Room","price":"","size":"","color":"","links":[],"img":"","notes":"LED lights, a poster, a little speaker. You know my style."}]}</script>

<script id="appjs">
{
const HEAD='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="theme-color" content="#f5f5f7">\n<title>My Christmas List</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">\n';
const $=id=>document.getElementById(id);
const shellSrc=$('shell').textContent, cssSrc=$('css').textContent, appSrc=$('appjs').textContent;
let state;
try{state=JSON.parse($('state').textContent)}catch(e){state={about:{},items:[]}}
state.about=state.about||{};state.items=state.items||[];
document.body.insertAdjacentHTML('afterbegin',shellSrc);

const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>/^https:\/\/[^\s<>"']+$/i.test(u);
const okImg=u=>/^\/_blob\/[A-Za-z0-9_\-.]+$/.test(u)||okUrl(u);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return 'store'}};
const uid=()=>Math.random().toString(36).slice(2,9);
let canEdit=false, editing=false, filter='all', editId=null, photo=null, undo=null, kind='exact';
try{editing=sessionStorage.getItem('cl-edit')==='1'}catch(e){}

const io='IntersectionObserver' in window?new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}},{rootMargin:'0px 0px -40px 0px'}):null;
function reveal(){let n=0;for(const el of document.querySelectorAll('.rv:not(.in)')){if(!io){el.classList.add('in');continue}if(el.classList.contains('item'))el.style.transitionDelay=(n++%3)*70+'ms';io.observe(el)}}

function toast(msg,actLabel,act){
  const t=$('toast');t.textContent=msg;
  if(actLabel){const b=document.createElement('button');b.textContent=actLabel;b.onclick=()=>{t.hidden=true;act()};t.appendChild(b)}
  t.hidden=true;void t.offsetWidth;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,actLabel?7000:3200);
}

function slide(seg,instant){
  const ind=seg.querySelector('.ind'),on=seg.querySelector('[aria-pressed=true]');if(!ind||!on)return;
  if(instant){ind.style.transition='none'}
  ind.style.left=on.offsetLeft+'px';ind.style.width=on.offsetWidth+'px';
  if(instant){void ind.offsetWidth;ind.style.transition=''}
}

function render(){
  const a=state.about, nm=(a.name||'').trim();
  $('title').textContent=nm?nm+"'s Christmas list.":'My Christmas list.';
  $('navName').textContent=nm?nm+"'s List":'Christmas List';
  document.title=nm?nm+"'s Christmas List":'My Christmas List';
  $('eyebrow').textContent='Holiday '+new Date().getFullYear();
  $('intro').textContent=a.intro||'';
  const sizes=(a.sizes||[]).filter(Boolean);
  const t=(k,v,cls)=>v?'<div class="tile rv'+(cls||'')+'"><p class="k">'+esc(k)+'</p><p class="v">'+esc(v)+'</p></div>':'';
  $('about').innerHTML=(sizes.length?'<div class="tile wide rv"><p class="k">My sizes</p><div class="specgrid">'+sizes.map(s=>{const i=s.indexOf(':');return i>0?'<div class="spec"><b>'+esc(s.slice(i+1).trim())+'</b><span>'+esc(s.slice(0,i))+'</span></div>':'<div class="spec"><b>'+esc(s)+'</b></div>'}).join('')+'</div></div>':'')
    +'<div class="tile wide rv"><p class="k">How this list works</p><ul class="legend"><li><span class="pill p-exact">Exact pick</span>The exact thing, with size, color and a link to buy it.</li><li><span class="pill p-idea">Gift idea</span>A starting point. Find something you think I\'d love.</li><li><span class="pill p-top">Top wish</span>The ones I\'m most excited about.</li></ul></div>'
    +t('Colors I like',a.colors)+t('Brands I like',a.brands)+t("Into lately",a.into)+t('Please skip',a.no)
    +(editing?'<div class="tile rv" style="display:grid;place-items:center"><button class="btn b-fill" id="editAbout">Edit About Me</button></div>':'');

  $('navAct').innerHTML=canEdit?(editing?'<button class="btn b-blue b-sm" id="doneBtn">Done</button>':'<button class="btn b-fill b-sm" id="editBtn">Edit</button>'):'';
  $('dock').innerHTML=canEdit&&editing?'<div class="dock" role="toolbar" aria-label="Edit list"><button class="btn b-blue" id="addBtn">+ Add Wish</button><button class="btn b-fill" id="impBtn">Paste from Notes</button>'+(state.sample?'<button class="btn b-fill" id="clrBtn">Clear Samples</button>':'')+'</div>':'';

  const items=state.items;
  const cats=[...new Set(items.map(i=>(i.cat||'').trim()).filter(Boolean))].sort();
  const f=[['all','All'],['top','Top Wishes'],['exact','Exact Picks'],['idea','Gift Ideas']].concat(cats.map(c=>['c:'+c,c]));
  if(!f.some(x=>x[0]===filter))filter='all';
  const seg=$('filters'), prev=seg.querySelector('.ind');
  const pl=prev?prev.style.left:'', pw=prev?prev.style.width:'';
  seg.innerHTML='<span class="ind" style="left:'+esc(pl)+';width:'+esc(pw)+'"></span>'+f.map(x=>'<button data-f="'+esc(x[0])+'" aria-pressed="'+(filter===x[0])+'">'+esc(x[1])+'</button>').join('');
  requestAnimationFrame(()=>slide(seg,!pl));
  $('cats').innerHTML=cats.map(c=>'<option value="'+esc(c)+'">').join('');
  $('sampleNote').hidden=!state.sample;

  const shown=items.filter(i=>filter==='all'||(filter==='top'&&i.top)||filter===i.kind||filter==='c:'+(i.cat||'').trim()).sort((x,y)=>(y.top?1:0)-(x.top?1:0));
  $('grid').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty"><b>Nothing here yet.</b>'+(canEdit?'Tap Edit, then Add Wish or Paste from Notes.':'Check back soon.')+'</div>';
  const when=state.updated?new Date(state.updated).toLocaleDateString(undefined,{month:'long',day:'numeric'}):'';
  $('foot').textContent=items.length+(items.length===1?' wish':' wishes')+(when?' · Updated '+when:'');
  reveal();
}

function card(i){
  const meta=[['Size',i.size],['Color',i.color]].filter(s=>s[1]);
  const links=(i.links||[]).filter(okUrl);
  const hasImg=i.img&&okImg(i.img);
  const missing=i.kind==='exact'&&!i.size&&!links.length;
  return '<article class="item rv">'
    +'<div class="pic'+(hasImg?'':' blank')+'">'+(hasImg?'<img src="'+esc(i.img)+'" alt="'+esc(i.title)+'" loading="lazy">':'<span class="ph" aria-hidden="true">'+esc((i.brand||i.title||'?').trim().slice(0,1).toUpperCase())+'</span>')
    +'<div class="pills">'+(i.kind==='idea'?'<span class="pill p-idea">Gift idea</span>':'<span class="pill p-exact">Exact pick</span>')+(i.top?'<span class="pill p-top">Top wish</span>':'')+'</div></div>'
    +'<div class="body">'+(i.brand?'<div class="brand">'+esc(i.brand)+'</div>':'')+'<h3>'+esc(i.title)+'</h3>'
    +(meta.length?'<p class="meta">'+meta.map(s=>s[0]+' <b>'+esc(s[1])+'</b>').join(' · ')+'</p>':'')
    +(i.notes?'<p>'+esc(i.notes)+'</p>':'')
    +(editing&&missing?'<p class="need">Add a size or link so it\'s easy to buy.</p>':'')
    +((links.length||i.price)?'<div class="buy">'+(i.price?'<span class="meta"><b>'+esc(i.price)+'</b></span>':'')+links.map((u,n)=>n?'<a class="tlink" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(host(u))+' ›</a>':'<a class="btn b-blue b-sm" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Buy at '+esc(host(u))+'</a>').join('')+'</div>':'')
    +(editing?'<div class="editrow"><button class="btn b-fill b-sm" data-edit="'+esc(i.id)+'">Edit</button></div>':'')
    +'</div></article>';
}

function buildDoc(){
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n'+HEAD+'<style id="css">'+cssSrc+'</style>\n</head>\n<body>\n<script type="text/html" id="shell">'+shellSrc+'</scr'+'ipt>\n\n<script type="application/json" id="state">'+json+'</scr'+'ipt>\n\n<script id="appjs">'+appSrc+'</scr'+'ipt>\n</body>\n</html>\n';
}

async function save(msg){
  state.updated=Date.now();render();
  const art=await use('artifact');
  if(!art){toast('Saved on this screen only. Open the list from its claude.ai link to save for everyone.');return}
  try{sessionStorage.setItem('cl-edit',editing?'1':'0')}catch(e){}
  try{await art.publish(buildDoc());toast(msg||'Saved')}
  catch(e){const c=String(e&&(e.code||e.message)||'');
    if(/conflict/.test(c))toast('Someone saved at the same moment. Loading their version.');
    else if(/not_granted|not_writer/.test(c)){canEdit=false;editing=false;render();toast('Only the list owner can make changes.')}
    else toast('Couldn\'t save. Check your connection and try again.')}
}

function openD(d){d.classList.remove('closing');d.showModal()}
function closeD(d){if(!d.open)return;if(matchMedia('(prefers-reduced-motion:reduce)').matches){d.close();return}d.classList.add('closing');setTimeout(()=>{d.classList.remove('closing');d.close()},230)}
function setKind(k){kind=k;$('kExact').setAttribute('aria-pressed',k==='exact');$('kIdea').setAttribute('aria-pressed',k==='idea');slide($('kExact').parentNode)}

function openItem(id){
  editId=id;const i=state.items.find(x=>x.id===id)||{kind:'exact',links:[]};
  $('itemH').textContent=id?'Edit Wish':'New Wish';
  $('fTitle').value=i.title||'';$('fBrand').value=i.brand||'';$('fCat').value=i.cat||'';$('fPrice').value=i.price||'';
  $('fSize').value=i.size||'';$('fColor').value=i.color||'';$('fTop').checked=!!i.top;
  $('fLinks').value=(i.links||[]).join('\n');$('fNotes').value=i.notes||'';$('fPhoto').value='';
  photo=i.img||'';showPhoto();$('fDel').hidden=!id;openD($('itemDlg'));
  requestAnimationFrame(()=>{kind=i.kind==='idea'?'idea':'exact';$('kExact').setAttribute('aria-pressed',kind==='exact');$('kIdea').setAttribute('aria-pressed',kind==='idea');slide($('kExact').parentNode,true)});
}
function showPhoto(){const p=$('fPrev');p.hidden=!photo;if(photo)p.src=photo;$('fNoPhoto').hidden=!photo;$('fPhotoL').textContent=photo?'Change photo':'Choose photo'}

$('fPhoto').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const assets=await use('assets');
  if(!assets){toast('Photos can be added when you open the list from its claude.ai link.');e.target.value='';return}
  $('fSave').disabled=true;$('fPhotoL').textContent='Uploading…';
  try{const r=await assets.upload(file);photo=r.url||('/_blob/'+r.id)}
  catch(err){toast('That photo didn\'t upload. Try a smaller screenshot.')}
  finally{$('fSave').disabled=false;showPhoto()}
});
$('fNoPhoto').onclick=()=>{photo='';$('fPhoto').value='';showPhoto()};

$('itemForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=id=>$(id).value.trim();
  const raw=v('fLinks').split(/\s+/).filter(Boolean);
  const links=raw.map(u=>/^http:\/\//i.test(u)?'https://'+u.slice(7):(/^https:\/\//i.test(u)?u:(/^[\w-]+(\.[\w-]+)+/.test(u)?'https://'+u:''))).filter(okUrl);
  if(raw.length>links.length)toast('Some links were skipped. Paste the full address from the store.');
  const item={id:editId||uid(),kind,top:$('fTop').checked,title:v('fTitle'),brand:v('fBrand'),cat:v('fCat'),price:v('fPrice'),size:v('fSize'),color:v('fColor'),links,img:photo||'',notes:v('fNotes')};
  if(!item.title){$('fTitle').focus();return}
  const n=state.items.findIndex(x=>x.id===item.id);
  if(n>=0)state.items[n]=item;else state.items.unshift(item);
  closeD($('itemDlg'));save(n>=0?'Wish updated':'Wish added');
});
$('fDel').onclick=()=>{
  const n=state.items.findIndex(x=>x.id===editId);if(n<0)return;
  const gone=state.items.splice(n,1)[0];closeD($('itemDlg'));render();
  clearTimeout(undo);
  toast('Deleted "'+gone.title+'"','Undo',()=>{clearTimeout(undo);state.items.splice(n,0,gone);render()});
  undo=setTimeout(()=>save('Wish deleted'),7000);
};

function openAbout(){
  const a=state.about;$('aName').value=a.name||'';$('aIntro').value=a.intro||'';$('aSizes').value=(a.sizes||[]).join('\n');
  $('aColors').value=a.colors||'';$('aBrands').value=a.brands||'';$('aInto').value=a.into||'';$('aNo').value=a.no||'';openD($('aboutDlg'));
}
$('aboutForm').addEventListener('submit',e=>{
  e.preventDefault();const v=id=>$(id).value.trim();
  state.about={name:v('aName'),intro:v('aIntro'),sizes:v('aSizes').split('\n').map(s=>s.trim()).filter(Boolean),colors:v('aColors'),brands:v('aBrands'),into:v('aInto'),no:v('aNo')};
  closeD($('aboutDlg'));save('About Me saved');
});

$('importForm').addEventListener('submit',e=>{
  e.preventDefault();
  const lines=$('iText').value.split('\n').map(l=>l.replace(/^[\s\-•*·◦▪☐☑✓✔\d.)]+/,'').trim()).filter(Boolean);
  if(!lines.length){closeD($('importDlg'));return}
  if(state.sample){state.items=state.items.filter(i=>!/^s\d$/.test(i.id));state.sample=false}
  const add=lines.slice(0,100).map(l=>{const idea=/^idea\s*[:\-]\s*/i.test(l);return {id:uid(),kind:idea?'idea':'exact',top:false,title:l.replace(/^idea\s*[:\-]\s*/i,'').slice(0,120),brand:'',cat:'',price:'',size:'',color:'',links:[],img:'',notes:''}});
  state.items=add.concat(state.items);$('iText').value='';closeD($('importDlg'));
  save(add.length+' wishes added. Tap Edit on each to add details.');
});

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.f){filter=t.dataset.f;render();return}
  if(t.dataset.kind){setKind(t.dataset.kind);return}
  if(t.dataset.edit){openItem(t.dataset.edit);return}
  if(t.hasAttribute('data-close')){closeD(t.closest('dialog'));return}
  switch(t.id){
    case 'editBtn':editing=true;render();break;
    case 'doneBtn':editing=false;try{sessionStorage.setItem('cl-edit','0')}catch(err){}render();break;
    case 'addBtn':openItem(null);break;
    case 'impBtn':openD($('importDlg'));break;
    case 'editAbout':openAbout();break;
    case 'clrBtn':state.items=state.items.filter(i=>!/^s\d$/.test(i.id));state.sample=false;save('Samples cleared');break;
  }
});
for(const d of document.querySelectorAll('dialog')){d.addEventListener('click',e=>{if(e.target===d)closeD(d)});d.addEventListener('cancel',e=>{e.preventDefault();closeD(d)})}
addEventListener('resize',()=>slide($('filters'),true));

render();
(async()=>{
  const u=await use('user');
  if(u){try{canEdit=!!(await u.canEdit())}catch(e){canEdit=false}}
  else canEdit=!!(await use('artifact'));
  if(!canEdit)editing=false;
  render();
})();
}
</script>
</body>
</html>
